<style>
:root{--bg:#f4f0eb;--card:#fffdf9;--ink:#292522;--muted:#8b837b;--line:#e5ddd4;--soft:#efe6dd;--accent:#7e695b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}button{font:inherit;cursor:pointer}#app{max-width:1100px;margin:auto;min-height:100vh;background:var(--card);box-shadow:0 20px 70px #00000012}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:16px 18px;background:#fffdf9ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.logo{font-size:12px;font-weight:800;letter-spacing:.08em}.sub{font-size:10px;color:var(--muted);margin-top:3px}.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:7px 9px;background:#fff;border:1px solid var(--line);border-radius:99px;font-size:10px}.wrap{padding:16px 16px 94px}.hero{padding:22px;border-radius:24px;background:linear-gradient(135deg,#eee5dd,#d9cabe);border:1px solid #ddcfc4}.hero small{letter-spacing:.12em;color:#74685f}.hero h1{margin:18px 0 7px;font-size:30px;line-height:1.05}.hero p{margin:0;max-width:700px;color:#5e564f;font-size:13px;line-height:1.65}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:13px;margin-top:13px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px}.card h3{font-size:13px;margin:0 0 10px}.room{height:430px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#f5eee6 0 58%,#d8c1a9 58%);border:1px solid #e7ddd3}.window{position:absolute;right:9%;top:10%;width:30%;height:25%;border:9px solid #e7dfd7;background:linear-gradient(#b8cad9,#e9e6e0)}.window:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #e7dfd7}.window:after{content:"";position:absolute;top:50%;left:0;right:0;border-top:3px solid #e7dfd7}.sofa{position:absolute;left:9%;bottom:16%;width:42%;height:82px;border-radius:18px;background:#ae9786}.table{position:absolute;right:12%;bottom:17%;width:30%;height:58px;border-radius:13px;background:#8e725f}.kitchen{position:absolute;left:3%;right:3%;bottom:2%;height:58px;border-radius:12px 12px 0 0;background:#eee7df;border:1px solid #dfd6cc}.hot{position:absolute;padding:8px 10px;border-radius:999px;border:1px solid #d9d0c7;background:#fffffff0;font-size:10px;color:#4d4640;box-shadow:0 7px 18px #0000000d}.hs1{left:12%;bottom:28%}.hs2{right:14%;bottom:28%}.hs3{left:7%;bottom:7%}.hs4{right:12%;top:39%}.char{position:absolute;width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:33px;border:4px solid #fff;box-shadow:0 8px 20px #0002}.char span{position:absolute;top:82px;font-size:10px;background:#fff;border:1px solid var(--line);padding:4px 6px;border-radius:8px;white-space:nowrap}.milo{right:25%;bottom:33%;background:#d6bda8}.nora{left:53%;top:42%;background:#c9c3bd}.bun{right:7%;bottom:8%;background:#fff2e5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.act{padding:11px;border-radius:13px;border:1px solid var(--line);background:#f8f4f0;text-align:left;min-height:55px}.act b{display:block;font-size:11px}.act small{display:block;color:var(--muted);font-size:9px;margin-top:3px;line-height:1.35}.log{margin-top:10px;max-height:220px;overflow:auto}.log div{padding:9px 10px;margin-bottom:7px;background:#faf7f3;border:1px solid #eee8df;border-radius:12px;font-size:10px;line-height:1.45}.log b{display:block;color:#897466;margin-bottom:3px;font-size:9px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.mini{padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}.mini b{font-size:11px}.mini p{font-size:10px;color:var(--muted);line-height:1.45;margin:5px 0 0}.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(950px,calc(100% - 20px));padding:6px;background:#fffdf9eF;border:1px solid var(--line);border-radius:17px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;box-shadow:0 10px 30px #0001;backdrop-filter:blur(12px);z-index:10}.nav button{border:0;background:transparent;padding:9px 4px;border-radius:11px;font-size:10px;color:#827970}.nav button.active{background:var(--soft);color:#3d3530;font-weight:700}.modal{position:fixed;inset:0;background:#2b241f66;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:30}.modal.show{display:flex}.sheet{width:min(680px,100%);max-height:84vh;overflow:auto;background:#fffdf9;border-radius:24px;padding:16px;border:1px solid var(--line);box-shadow:0 25px 80px #0003}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh h3{margin:0;font-size:15px}.close{width:32px;height:32px;border:0;border-radius:10px;background:#eee8e0}.story{font-size:14px;line-height:1.8;white-space:pre-wrap}.choices{display:grid;gap:7px;margin-top:14px}.choice{padding:11px 12px;border-radius:13px;border:1px solid var(--line);background:#f8f4f0;text-align:left;font-size:11px}.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;background:#faf7f3}.ico{width:42px;height:42px;border-radius:12px;background:#eee2d7;display:flex;align-items:center;justify-content:center;font-size:20px}.item b{font-size:11px}.item small{display:block;color:var(--muted);font-size:9px;line-height:1.35;margin-top:2px}.buy{margin-left:auto;padding:7px 9px;border:0;border-radius:9px;background:#3d3631;color:#fff;font-size:9px}.buy:disabled{background:#c5beb8}.intro{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.introbox{width:min(520px,100%);padding:24px;border:1px solid var(--line);border-radius:26px;background:#fff;box-shadow:0 20px 70px #00000012}.introbox h2{font-size:28px;line-height:1.05;margin:10px 0}.introbox p{font-size:12px;color:#756d65;line-height:1.7}.introbox input{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);outline:0;margin:6px 0 10px}.primary{width:100%;padding:13px;border:0;border-radius:13px;background:#403934;color:#fff;font-weight:700}
@media(max-width:800px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.hero h1{font-size:25px}.room{height:360px}}@media(max-width:560px){.wrap{padding:12px 11px 92px}.top{padding:13px 11px}.stats{max-width:200px}.shop{grid-template-columns:1fr}}
</style></head><body>
<div id="app"></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const KEY='7days_vertical_slice_2026';
const S={name:'',day:1,slot:0,money:120,energy:5,rel:{milo:0,nora:0,unknown:0},items:[],notes:[],log:[],seen:{}};
const times=[['09:00','早晨'],['12:30','午后'],['16:30','傍晚前'],['20:00','晚上'],['00:10','深夜']];
const items=[
['coffee','☕','冷萃咖啡',6,'今天也许值得清醒一点。'],['snack','🍓','草莓糖',5,'绒团团会记住。'],['lamp','🪔','暖灯',25,'放进房间，夜晚会改变一些东西。'],['milo','🎁','游戏挂件',18,'米洛看见会嘴硬。'],['nora','🪞','极简香氛',22,'诺拉大概率会停一下。'],['coat','🧥','宽松外套',45,'让你更像这里的人。']
];
function $(x){return document.getElementById(x)}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)Object.assign(S,x)}catch(e){}}
function has(id){return S.items.includes(id)}
function addItem(id){if(!has(id))S.items.push(id)}
function relText(v){return v<2?'刚认识':v<5?'有点熟':v<9?'越来越熟':v<13?'关系微妙':'很亲近'}
function log(t,x){S.log.unshift({d:S.day,t,x});S.log=S.log.slice(0,14)}
function close(){ $('modal').classList.remove('show') }
function sheet(title,html){$('sheet').innerHTML='<div class="mh"><h3>'+title+'</h3><button class="close" onclick="close()">×</button></div>'+html;$('modal').classList.add('show')}
function next(){if(S.slot<times.length-1){S.slot++;S.energy=Math.max(0,S.energy-1)}else{S.day++;S.slot=0;S.energy=5;S.money+=18;log('生活','睡了一觉。今天到账 $18。')}save();render()}
function use(){if(S.energy<=0){alert('今天已经有点累了。');return false}return true}
function scene(title,text,choices){sheet(title,'<div class="story">'+text+'</div><div class="choices">'+choices.map((c,i)=>'<button class="choice" onclick="pick('+i+')">'+c[0]+'</button>').join('')+'</div>');window._choices=choices}
function pick(i){const c=window._choices[i];if(c[1])c[1]();close();next()}
function mainEvent(){
 if(S.day===1&&!S.seen.milo){S.seen.milo=true;S.rel.milo+=1;S.notes.push('米洛：冰箱右边那格别动。');scene('DAY 1 · 米洛','你把最后一个箱子拖进客厅。\n\n米洛从游戏里抬头。\n\n“你就是新来的？”\n\n他看了一眼你的行李。\n\n“行李这么少？你准备只住一周，还是七天以后跑路？”\n\n你还没回答，他就笑了。\n\n“别紧张。我很好相处。”\n\n停半秒。\n\n“……大部分时候。”',[['“你这是在欢迎我吗？”',()=>S.rel.milo+=1],['“冰箱那格我不会动。”',()=>S.rel.milo+=2],['先去看那只白兔。',()=>S.rel.unknown+=1]]);return}
 if(S.day===2&&!S.seen.nora&&S.slot>=2){S.seen.nora=true;S.rel.nora+=1;scene('DAY 2 · 诺拉','诺拉回到公寓，把钥匙放下。\n\n“你是昨天搬进来的？”\n\n“诺拉。”\n\n她扫了一眼地面。\n\n“米洛是不是又把鞋扔这里？”\n\n你低头。真的有。\n\n她闭了闭眼。\n\n“……很好。”\n\n然后她问：\n\n“晚饭吃什么？”',[['“你想吃什么？”',()=>S.rel.nora+=2],['“出去吃，我请。”',()=>S.rel.nora+=1],['“我做一点，你吃辣吗？”',()=>S.rel.nora+=2]]);return}
 if(S.day===2&&!S.seen.light&&S.slot>=3){S.seen.light=true;S.notes.push('绒团团：这盏灯明明是昨天才坏掉的。');S.rel.unknown+=2;scene('DAY 2 · 23:57','你去厨房倒水。\n\n灯闪了一下。\n\n又一下。\n\n你正准备离开，绒团团抬起头。\n\n“你刚刚也看到了？”\n\n“什么？”\n\n“灯呀。”\n\n它低头吃了一口草莓。\n\n“这盏灯明明是昨天才坏掉的。”',[['追问“你昨天在哪里？”',()=>S.rel.unknown+=2],['当没听见。',()=>{}],['拍下来。',()=>addItem('photo')]]);return}
 if(S.day>=3&&!S.seen.unknown){S.seen.unknown=true;scene('DAY 3 · 陌生消息','手机亮了一下。\n\n【陌生号码】\n\n“你也看到那盏灯了？”\n\n没有头像。\n\n没有第二条消息。\n\n米洛从客厅经过。\n\n“谁给你发消息？”\n\n你把手机扣下。\n\n他看了你一眼。\n\n走两步。\n\n又停下来。\n\n“……如果你准备去问那件事，先跟我说。”',[['把消息给米洛看。',()=>S.rel.milo+=2],['先藏着。',()=>S.rel.unknown+=1],['去找诺拉。',()=>S.rel.nora+=2]]);return}
 scene('生活','今天没有强制剧情。你可以继续经营自己的生活，也许反而会撞见别的东西。',[['继续',()=>{}]])
}
function act(kind){if(!use())return;S.energy=Math.max(0,S.energy-1);
 if(kind==='main'){mainEvent();return}
 if(kind==='milo'){S.rel.milo+=1;scene('米洛','你敲门。\n\n“等一下——”\n\n五分钟后，门开了一条缝。\n\n“我刚刚在打关键局。”\n\n你看着他。\n\n“你是不是因为我输了？”\n\n“没有。”\n\n“你语气不像。”',[['陪他打一局。',()=>S.rel.milo+=2],['嘲笑他。',()=>S.rel.milo+=1],['让他自己冷静。',()=>{}]]);return}
 if(kind==='nora'){S.rel.nora+=1;scene('诺拉','你找到诺拉。她正在看手机。\n\n你坐下。\n\n她抬眼：“怎么？”\n\n你说：“没什么。”\n\n她盯着你。\n\n“你每次说没什么的时候，通常都有点什么。”',[['“那你猜。”',()=>S.rel.nora+=2],['“你观察人都这么仔细吗？”',()=>S.rel.nora+=1],['转移话题。',()=>{}]]);return}
 if(kind==='bun'){S.rel.unknown+=1;scene('绒团团','绒团团正在偷你的草莓糖。\n\n它看见你。\n\n“别看我。”\n\n“这是赔偿。”\n\n“赔偿什么？”\n\n它沉默。\n\n“……我昨天差点把你家的灯弄坏。”',[['“你知道那盏灯的事？”',()=>S.rel.unknown+=2],['“行，吃吧。”',()=>addItem('snack')],['把糖拿回来。',()=>{}]]);return}
 if(kind==='work'){S.money+=28;log('生活','做了一会儿临时工作，赚到 $28。');next();return}
 if(kind==='city'){city();return}
 if(kind==='phone'){phone();return}
 next();}
function city(){sheet('城市','<p style="font-size:11px;color:#7f776f;line-height:1.6">这一段时间，你可以离开公寓。城市不会一直等你。</p><div class="shop"><button class="item" onclick="visit(\'store\')"><div class="ico">🛒</div><div><b>便利店</b><small>买点东西，也许遇见熟人。</small></div></button><button class="item" onclick="visit(\'cafe\')"><div class="ico">☕</div><div><b>咖啡店</b><small>安静坐一会儿。</small></div></button><button class="item" onclick="visit(\'mall\')"><div class="ico">🛍️</div><div><b>商场</b><small>礼物和房间用品。</small></div></button><button class="item" onclick="visit(\'river\')"><div class="ico">🌙</div><div><b>河岸</b><small>晚上有点奇怪。</small></div></button></div>')}
function visit(x){if(x==='mall'){shop();return}close();if(x==='store'){S.money-=6;addItem('coffee');log('城市','便利店：你买了一杯冷萃。');next();return}if(x==='cafe'){S.rel.unknown+=1;log('城市','咖啡店：你遇到一个高个子的陌生男人。');scene('咖啡店','你坐在角落。\n\n一个高个子的男人从你旁边经过。\n\n他看了你一眼。\n\n只一眼。\n\n然后走了。',[['记住他的脸。',()=>S.rel.unknown+=1],['当作没看见。',()=>{}]]) ;return}if(x==='river'){addItem('ticket');log('城市','河岸：你捡到一张没有日期的票。');scene('河岸','夜里的河岸几乎没人。\n\n你远远看见一个人站在桥边。\n\n等你走近，他已经不见了。\n\n地上只剩下一张票。',[['捡起来。',()=>{}]]) ;return}}
function shop(){sheet('商城 · $'+S.money,'<div class="shop">'+items.map((x,i)=>'<div class="item"><div class="ico">'+x[1]+'</div><div><b>'+x[2]+'</b><small>$'+x[3]+' · '+x[4]+'</small></div><button class="buy" '+(S.money<x[3]||has(x[0])?'disabled':'')+' onclick="buy('+i+')">'+(has(x[0])?'已购':'购买')+'</button></div>').join('')+'</div>')}
function buy(i){const x=items[i];if(has(x[0])||S.money<x[3])return;S.money-=x[3];addItem(x[0]);if(x[0]==='milo')S.rel.milo+=2;if(x[0]==='nora')S.rel.nora+=2;if(x[0]==='snack')S.rel.unknown+=1;log('商城','买了'+x[2]+'。');save();shop()}
function phone(){sheet('手机','<div class="cards"><button class="mini" onclick="shop()"><b>🛍️ 商城</b><p>余额 $'+S.money+'</p></button><button class="mini" onclick="messages()"><b>💬 消息</b><p>最近没有未读，但不代表没人想找你。</p></button><button class="mini" onclick="notes()"><b>📝 记忆</b><p>'+S.notes.length+' 条。</p></button></div>')}
function messages(){sheet('消息','<div class="log"><div><b>房东</b>先住一周。觉得合适，就继续住。</div><div><b>米洛</b>等一下。我现在忙。</div><div><b>诺拉</b>回来记得给我发消息。</div>'+(S.seen.unknown?'<div><b>陌生号码</b>你也看到那盏灯了？</div>':'' )+'</div>')}
function notes(){sheet('记忆','<div class="log">'+(S.notes.length?S.notes.map(x=>'<div>'+x+'</div>').join(''):'<div>目前还没有特别的事。</div>')+'</div>')}
function relations(){sheet('关系','<div class="log"><div><b>🎧 米洛 · '+relText(S.rel.milo)+'</b>他看起来不太把什么事情放在心上，但你已经发现他会记细节。</div><div><b>🪞 诺拉 · '+relText(S.rel.nora)+'</b>漂亮、强势、自己处理情绪，不喜欢被替她做决定。</div><div><b>🕶️ ??? · '+relText(S.rel.unknown)+'</b>你只见过一两次。你还不知道他是谁。</div></div>')}
function resetGame(){if(confirm('确定重置？')){localStorage.removeItem(KEY);location.reload()}}
function render(){const t=times[S.slot];$('app').innerHTML='<div class="top"><div><div class="logo">7 DAYS WITH YOUR ROOMMATE</div><div class="sub">LIFE + RELATIONSHIP + STORY · VERTICAL SLICE</div></div><div class="stats"><span class="pill">DAY '+S.day+'</span><span class="pill">'+t[0]+'</span><span class="pill">⚡ '+S.energy+'/5</span><span class="pill">💵 $'+S.money+'</span></div></div><div class="wrap"><div class="hero"><small>WEEK 01 · '+t[1].toUpperCase()+'</small><h1>'+S.name+'，今天怎么过？</h1><p>你可以赚钱、花钱、买东西、探索城市、跟人相处，也可以什么都不做。<b>自由不会自己变得有趣——你做的选择，才会让生活产生后果。</b></p></div><div class="layout"><div class="card"><h3>你的公寓 · 直接点</h3><div class="room"><div class="window"></div><div class="sofa"></div><div class="table"></div><div class="kitchen"></div><button class="hot hs1" onclick="act(\'free\')">坐沙发</button><button class="hot hs2" onclick="phone()">看手机</button><button class="hot hs3" onclick="act(\'free\')">厨房</button><button class="hot hs4" onclick="act(\'city\')">出门</button><div class="char milo" onclick="act(\'milo\')">🎧<span>米洛</span></div>'+ (S.day>=2?'<div class="char nora" onclick="act(\'nora\')">🪞<span>诺拉</span></div>':'') +'<div class="char bun" onclick="act(\'bun\')">🐇<span>绒团团</span></div></div></div><div class="card"><h3>自由行动</h3><div class="actions"><button class="act" onclick="act(\'milo\')">🎧 <b>找米洛</b><small>看看他今天在干嘛</small></button><button class="act" onclick="act(\'nora\')">🪞 <b>找诺拉</b><small>她不一定有空</small></button><button class="act" onclick="act(\'bun\')">🐇 <b>找绒团团</b><small>它可能知道奇怪的事</small></button><button class="act" onclick="act(\'city\')">🌆 <b>去城市</b><small>便利店 / 咖啡店 / 商场 / 河岸</small></button><button class="act" onclick="shop()">🛍️ <b>商城</b><small>钱不是摆设</small></button><button class="act" onclick="act(\'main\')">📖 <b>看今天会不会发生什么</b><small>推进主线 / 随机事件</small></button><button class="act" onclick="act(\'work\')">💼 <b>去兼职</b><small>赚钱，消耗这一段时间</small></button></div><h3 style="margin-top:13px">最近发生</h3><div class="log">'+(S.log.length?S.log.map(x=>'<div><b>DAY '+x.d+' · '+x.t+'</b>'+x.x+'</div>').join(''):'<div><b>DAY 1</b>你刚搬进来。</div>')+'</div></div></div><div class="cards"><div class="mini"><b>💵 钱包</b><p>$'+S.money+' · 可以买生活、礼物、房间东西。</p></div><div class="mini"><b>🤝 关系</b><p>米洛：'+relText(S.rel.milo)+' · 诺拉：'+relText(S.rel.nora)+'</p></div><div class="mini"><b>🧠 记忆</b><p>'+(S.notes.length?S.notes[S.notes.length-1]:'你的故事还没开始。')+'</p></div></div></div><div class="nav"><button class="active" onclick="render()">🏠<br>公寓</button><button onclick="phone()">📱<br>手机</button><button onclick="city()">🌆<br>城市</button><button onclick="relations()">♡<br>关系</button><button onclick="next()">→<br>结束这一段</button></div>'}

load();if(!S.name){document.body.insertAdjacentHTML('beforeend','<div class="intro" id="intro"><div class="introbox"><div class="logo">7 DAYS WITH YOUR ROOMMATE</div><h2>你不是来做题的。<br>你是来住一周的。</h2><p>这一版开始加入真正的生活循环：<b>钱包、商城、自由行动、关系、记忆、城市和主线事件。</b></p><input id="name" placeholder="你的名字" maxlength="18"><button class="primary" onclick="start()">搬进去</button><p style="font-size:9px;text-align:center;margin-bottom:0">Prototype · 不是最终 Steam 美术版本</p></div></div>')}else render();
