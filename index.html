<script>
const KEY='7days_vertical_slice_2026';
const S={name:'',day:1,slot:0,money:120,energy:5,rel:{milo:0,nora:0,unknown:0},items:[],notes:[],log:[],seen:{},finished:false,reason:''};
const times=[['09:00','早晨'],['12:30','午后'],['16:30','傍晚前'],['20:00','晚上'],['00:10','深夜']];
const items=[
['coffee','☕','冷萃咖啡',6,'今天也许值得清醒一点。'],['snack','🍓','草莓糖',5,'绒团团会记住。'],['lamp','🪔','暖灯',25,'放进房间，夜晚会改变一些东西。'],['milo','🎁','游戏挂件',18,'米洛看见会嘴硬。'],['nora','🪞','极简香氛',22,'诺拉看到会停一下。'],['coat','🧥','宽松外套',45,'让你更像这里的人。'],['ticket','🎫','无日期车票',0,'上面没有写时间。']
];
function $(x){return document.getElementById(x)}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)Object.assign(S,x);if(S.day>7){S.day=7;S.slot=times.length-1;S.finished=true}}catch(e){}}
function has(id){return S.items.includes(id)}
function addItem(id){if(!has(id))S.items.push(id)}
function relText(v){return v<2?'刚认识':v<5?'有点熟':v<9?'越来越熟':v<13?'关系微妙':'很亲近'}
function log(t,x){S.log.unshift({d:S.day,t,x});S.log=S.log.slice(0,18)}
function closeModal(){ $('modal').classList.remove('show') }
function sceneArt(kind,label,detail=''){
 const map={
  home:['🏠','公寓','暖灯、沙发和一扇总有人忘记关的门'],
  cafe:['☕','咖啡店','窗边的位置总有人坐过，杯沿还有一点水汽'],
  work:['🧾','便利店兼职','荧光灯、收银机和永远整理不完的货架'],
  river:['🌙','河岸','桥灯落在水面上，像一条被拉长的白线'],
  night:['💡','深夜厨房','灯光忽明忽暗，像在等你发现什么'],
  room:['🛏️','你的房间','箱子还没完全拆完，生活正在慢慢占满这里']
 };
 const a=map[kind]||map.home;
 return `<div class="sceneVisual" style="background:linear-gradient(135deg,${kind==='night'?'#413b46,#82766c':kind==='river'?'#25323e,#6f7c84':kind==='work'?'#ddd4c8,#efe9e1':kind==='cafe'?'#d8c8bd,#eee2d8':'#e2d5ca,#f2e9e0'})"><span class="sceneEmoji">${a[0]}</span><div><b>${label||a[1]}</b><small>${detail||a[2]}</small></div></div>`
}
function sheet(title,html){$('sheet').innerHTML='<div class="mh"><h3>'+title+'</h3><button class="close" onclick="closeModal()">×</button></div>'+html;$('modal').classList.add('show')}
function use(){if(S.finished)return false;if(S.energy<=0){alert('今天已经有点累了。');return false}S.energy=Math.max(0,S.energy-1);return true}
function next(){
 if(S.finished)return;
 if(S.day===7&&S.slot===times.length-1){S.finished=true;save();showEnding();return}
 if(S.slot<times.length-1){S.slot++;S.energy=Math.max(0,S.energy-1)}else{S.day++;S.slot=0;S.energy=5;S.money+=18;log('生活','睡了一觉。今天到账 $18。')}
 save();render();
}
function showEnding(){
 const relationship = `米洛：${relText(S.rel.milo)} · 诺拉：${relText(S.rel.nora)} · 那个陌生人：${relText(S.rel.unknown)}`;
 sheet('WEEK 01 · DAY 7 · 这一周结束了',`${sceneArt('home','第七天 · 门口','七天前这里还是一套陌生的公寓。现在你知道太多东西了。')}<div class="story">七天前，你只是来这里住一阵子。

现在你站在门口。

你发现自己真正舍不得的，可能根本不是这套房子。

<strong>${relationship}</strong>

而那些灯光、消息、车票，以及从来没有解释清楚的“昨天”，仍然留在你的记忆里。

<strong>第一周在这里结束。</strong>

正式版本里，这里会根据你的关系、购买物品、错过或触发的事件，进入不同的周结局；然后你可以重新开始，让新的选择改变这一周。 </div><div class="choices"><button class="choice" onclick="restartWeek()">重新开始这一周</button><button class="choice" onclick="showEndingReview()">查看这一周</button></div>`)
}
function showEndingReview(){
 sheet('WEEK 01 · 记忆回顾',`${sceneArt('room','这一周留下的东西','有些东西你已经习惯了，有些东西还无法解释。')}<div class="log">${(S.log.length?S.log:S.notes.map(x=>({d:1,t:'记忆',x}))).map(x=>'<div><b>DAY '+x.d+' · '+x.t+'</b>'+x.x+'</div>').join('')}</div><div class="choices"><button class="choice" onclick="restartWeek()">重新开始这一周</button></div>`)
}
function restartWeek(){
 const name=S.name;localStorage.removeItem(KEY);Object.assign(S,{name,day:1,slot:0,money:120,energy:5,rel:{milo:0,nora:0,unknown:0},items:[],notes:[],log:[],seen:{},finished:false,reason:''});log('重新开始','你又一次搬进了这套公寓。');save();closeModal();render();setTimeout(()=>opening(),120)
}
function opening(){
 sheet('PROLOGUE · 你为什么会住进这里？',`${sceneArt('home','搬进来的第一天','新的城市、新的钥匙、一周的临时住处。')}<div class="story">你把最后一个箱子放在门边。

房东说：“先住一周。觉得合适，就继续住。”

听起来再普通不过。

可你还是有一种奇怪的感觉——像是自己并不是“找到”了这套房子，而是被它刚好接住了。</div><div class="choices"><button class="choice" onclick="chooseReason('change')">我只是想换个环境</button><button class="choice" onclick="chooseReason('week')">我本来就只打算住一周</button><button class="choice" onclick="chooseReason('escape')">我想离一些人远一点</button></div>`)
}
function chooseReason(r){S.reason=r;S.seen.reason=true;S.notes.push(r==='change'?'你搬来这里，是因为想换个环境。':r==='week'?'你一开始就没打算住很久。':'你没有告诉别人，你为什么想离开原来的生活。');save();closeModal();render()}
function mainEvent(){
 if(S.day===1&&!S.seen.milo){
  S.seen.milo=true;S.rel.milo+=1;S.notes.push('米洛：冰箱右边那格别动。');
  scene('DAY 1 · 你终于见到米洛',`${sceneArt('home','客厅 · 17:04','游戏声音从半掩着的房门里漏出来。')}<div class="story">你把最后一个箱子拖进客厅。

米洛从游戏里抬头。

“你就是新来的？”

他看了一眼你的行李。

“行李这么少？你准备只住一周，还是七天以后跑路？”

你还没回答，他就笑了。

“别紧张。我很好相处。”

停半秒。

“……大部分时候。”

门口的绒团团突然打了个喷嚏。</div>`,[['“你这是在欢迎我吗？”',()=>S.rel.milo+=1],['“冰箱那格我不会动。”',()=>S.rel.milo+=2],['先去看那只白兔。',()=>S.rel.unknown+=1]]);return
 }
 if(S.day===2&&!S.seen.nora&&S.slot>=2){
  S.seen.nora=true;S.rel.nora+=1;
  scene('DAY 2 · 诺拉回来了',`${sceneArt('home','玄关 · 18:20','门锁轻响。一个人站在门口看了你两秒。')}<div class="story">诺拉回到公寓，把钥匙放下。

“你是昨天搬进来的？”

“诺拉。”

她扫了一眼地面。

“米洛是不是又把鞋扔这里？”

你低头。真的有。

她闭了闭眼。

“……很好。”

然后她问：

“晚饭吃什么？”

这是她第一次主动把你算进自己的生活。</div>`,[['“你想吃什么？”',()=>S.rel.nora+=2],['“出去吃，我请。”',()=>S.rel.nora+=1],['“我做一点，你吃辣吗？”',()=>S.rel.nora+=2]]);return
 }
 if(S.day===2&&!S.seen.light&&S.slot>=3){
  S.seen.light=true;S.rel.unknown+=2;S.notes.push('绒团团：这盏灯明明是昨天才坏掉的。');
  scene('DAY 2 · 23:57',`${sceneArt('night','厨房 · 深夜','只有一盏灯还亮着。')}<div class="story">你去厨房倒水。

灯闪了一下。

又一下。

你正准备离开，绒团团抬起头。

“你刚刚也看到了？”

“什么？”

“灯呀。”

它低头吃了一口草莓。

“这盏灯明明是昨天才坏掉的。”

你突然停住。

你昨天根本还没住进来。</div>`,[['追问“你昨天在哪里？”',()=>S.rel.unknown+=2],['当没听见。',()=>{}],['拍下来。',()=>{addItem('photo');S.notes.push('你拍下了那盏坏掉的灯。')}]]);return
 }
 if(S.day===3&&!S.seen.unknown){
  S.seen.unknown=true;S.rel.unknown+=1;
  scene('DAY 3 · 陌生消息',`${sceneArt('room','手机亮了一下','没有头像，也没有备注。只有一句话。')}<div class="story">【陌生号码】

“你也看到那盏灯了？”

没有头像。

没有第二条消息。

米洛从客厅经过。

“谁给你发消息？”

你把手机扣下。

他看了你一眼。

走两步。

又停下来。

“……如果你准备去问那件事，先跟我说。”</div>`,[['把消息给米洛看。',()=>{S.rel.milo+=2}],['先藏着。',()=>S.rel.unknown+=1],['去找诺拉。',()=>S.rel.nora+=2]]);return
 }
 if(S.day===4&&!S.seen.d4){
  S.seen.d4=true;
  scene('DAY 4 · 米洛知道得比你想的多',`${sceneArt('home','客厅 · 21:14','电视没开，只有游戏主机的待机灯还亮着。')}<div class="story">你把那张车票放在桌上。

米洛看见它之后，第一次没有开玩笑。

“你从哪弄到的？”

“河边。”

他沉默了一会儿。

“……这个地方以前没有河。”

你：“你刚刚说什么？”

他抬眼。

“没什么。”

然后他把车票推回你面前。

“别把它丢了。”</div>`,[['逼他解释。',()=>S.rel.milo+=2],['先把票收起来。',()=>addItem('ticket')],['问“你以前来过这里？”',()=>{S.rel.milo+=1;S.seen.miloPast=true}]]);return
 }
 if(S.day===5&&!S.seen.d5){
  S.seen.d5=true;
  scene('DAY 5 · 诺拉终于说了一点',`${sceneArt('home','阳台 · 22:03','城市的灯在远处一盏一盏亮起来。')}<div class="story">诺拉站在阳台上。

你走过去，她没有回头。

“你是不是已经发现了？”

“发现什么？”

“这套房子不太对。”

她笑了一下。

很轻。

“我第一次住进来的时候，也这么问过。”

你愣住。

她终于看向你。

“但我只住到第七天。”</div>`,[['“那第七天发生了什么？”',()=>S.rel.nora+=2],['“你以前住过这里？”',()=>S.rel.nora+=1],['不追问。',()=>{}]]);return
 }
 if(S.day===6&&!S.seen.d6){
  S.seen.d6=true;
  scene('DAY 6 · 所有人都在',`${sceneArt('night','停电后的客厅','整栋楼突然停电。手机成为唯一的光。')}<div class="story">晚上九点十七分，整栋楼停电。

米洛、诺拉和你第一次同时站在客厅。

绒团团蹲在桌子上。

谁都没有说话。

三秒后，绒团团开口：

“你们是不是忘了？”

米洛：“忘了什么？”

绒团团看着你。

“第七天。”

窗外突然重新亮起来。

桌上多了一张照片。

照片里，是你们三个站在这里。

照片背面只有一行字：

“别让他们在第七天分开。”</div>`,[['拿起照片。',()=>{addItem('photo');S.notes.push('第六天停电后，桌上出现了三个人的照片。')}],['先问米洛。',()=>S.rel.milo+=2],['先问诺拉。',()=>S.rel.nora+=2]]);return
 }
 if(S.day===7&&!S.seen.d7){
  S.seen.d7=true;
  scene('DAY 7 · 你要留下吗？',`${sceneArt('home','第七天 · 23:40','门没有锁。门外很安静。')}<div class="story">第七天快结束了。

你站在门口。

米洛说：“如果你要走，现在还来得及。”

诺拉没有说话。

绒团团蹲在地毯上。

它第一次没有卖关子。

“如果你留下，明天就不是第八天。”

你皱眉。

“那是什么？”
