<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f2ee" />
<title>7 DAYS WITH YOUR ROOMMATE · MVP</title>
<style>
  :root{
    --bg:#f4f0ec;
    --paper:#fffdf9;
    --ink:#2d2a2a;
    --muted:#827b78;
    --line:#e7dfd9;
    --soft:#efe8e2;
    --accent:#6f5d72;
    --accent2:#b58a9a;
    --shadow:0 14px 35px rgba(53,43,39,.10);
    --radius:24px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  button,input{font:inherit}
  button{cursor:pointer}
  .app{min-height:100vh;padding:18px 14px calc(30px + env(safe-area-inset-bottom));}
  .shell{max-width:760px;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
  .brand{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .save-dot{font-size:11px;color:var(--muted)}
  .card{background:rgba(255,253,249,.94);border:1px solid rgba(231,223,217,.9);border-radius:var(--radius);box-shadow:var(--shadow)}
  .hero{padding:18px}
  .weekline{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
  .weekline .week{font-size:12px;color:var(--muted);letter-spacing:.12em;font-weight:700}
  .time{font-size:15px;font-weight:700}
  .scene{margin-top:14px;padding:20px;min-height:250px;position:relative;overflow:hidden;background:linear-gradient(145deg,#f8f4f0,#fffdfa)}
  .scene::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(181,138,154,.13),transparent 30%),radial-gradient(circle at 15% 80%,rgba(111,93,114,.10),transparent 34%);pointer-events:none}
  .scene-title{font-size:13px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px;position:relative;z-index:1}
  .scene-name{font-size:26px;font-weight:800;position:relative;z-index:1}
  .scene-desc{font-size:15px;line-height:1.7;max-width:620px;margin-top:8px;position:relative;z-index:1}
  .people{display:flex;gap:12px;align-items:flex-end;margin-top:20px;position:relative;z-index:1}
  .avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:70px}
  .avatar{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-weight:800;border:1px solid rgba(0,0,0,.06);box-shadow:0 7px 18px rgba(0,0,0,.08)}
  .avatar.milo{background:#ece5ee;color:#624d66}
  .avatar.nora{background:#eee8de;color:#67584a}
  .avatar.rabbit{background:#f1edf6;color:#71567b}
  .avatar.player{background:#eee8e2;color:#5b544f}
  .name{font-size:12px;color:var(--muted);font-weight:700}
  .quote{margin-top:18px;padding:14px 15px;border-radius:18px;background:rgba(255,255,255,.72);border:1px solid var(--line);font-size:14px;line-height:1.65;position:relative;z-index:1}
  .layout{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
  .panel{padding:16px}
  .panel-title{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px 12px;text-align:left;color:var(--ink);transition:transform .12s ease,background .12s ease}
  .btn:active{transform:scale(.98)}
  .btn:hover{background:#fcfaf8}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.soft{background:var(--soft)}
  .btn .label{font-weight:800;font-size:14px}
  .btn .sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
  .btn.primary .sub{color:rgba(255,255,255,.68)}
  .status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:#fcfaf8;border:1px solid var(--line);padding:11px;border-radius:15px}
  .stat .k{font-size:11px;color:var(--muted);margin-bottom:4px}
  .stat .v{font-size:13px;font-weight:800}
  .log{max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:9px}
  .entry{padding:10px 11px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:13px;line-height:1.55}
  .entry small{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}
  .footer-row{display:flex;gap:9px;margin-top:12px}
  .footer-row .btn{flex:1;text-align:center}
  .overlay{position:fixed;inset:0;background:rgba(30,26,25,.42);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:20}
  .overlay.show{display:flex}
  .sheet{width:min(760px,100%);background:var(--paper);border-radius:26px 26px 16px 16px;max-height:88vh;overflow:auto;box-shadow:0 28px 80px rgba(0,0,0,.20);padding:18px}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .sheet-title{font-size:20px;font-weight:850}
  .x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff}
  .choice-list{display:grid;gap:9px}
  .choice{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left}
  .choice strong{display:block;font-size:14px;margin-bottom:5px}
  .choice span{font-size:12px;color:var(--muted);line-height:1.5}
  .input{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px 14px;outline:none}
  .input:focus{border-color:#b9a7b1;box-shadow:0 0 0 3px rgba(181,138,154,.12)}
  .gender{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .gender button{border:1px solid var(--line);background:#fff;padding:12px 8px;border-radius:14px;color:var(--ink)}
  .gender button.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .tiny{font-size:11px;color:var(--muted);line-height:1.55}
  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);padding:10px 14px;border-radius:999px;background:rgba(45,42,42,.94);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hidden{display:none!important}
  .complete{padding:24px;text-align:center}
  .complete h2{font-size:28px;margin:4px 0 8px}
  .complete p{color:var(--muted);font-size:14px;line-height:1.7}
  @media (min-width:700px){
    .layout{grid-template-columns:1.15fr .85fr}
    .actions{grid-template-columns:1fr 1fr 1fr}
  }
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <div class="topbar">
      <div class="brand">7 DAYS WITH YOUR ROOMMATE</div>
      <div class="save-dot" id="saveStatus">未保存</div>
    </div>

    <section class="card hero">
      <div class="weekline">
        <div class="week" id="weekDay">WEEK 1 · DAY 0</div>
        <div class="time" id="clock">MOVE-IN</div>
      </div>
      <div class="scene card" id="sceneCard">
        <div class="scene-title" id="sceneLocation">公寓 · 门口</div>
        <div class="scene-name" id="sceneTitle">搬进来</div>
        <div class="scene-desc" id="sceneDesc"></div>
        <div class="people" id="people"></div>
        <div class="quote hidden" id="quote"></div>
      </div>
    </section>

    <div id="gameArea" class="layout">
      <section class="card panel">
        <div class="panel-title">现在可以做什么</div>
        <div class="actions" id="actions"></div>
      </section>

      <aside class="card panel">
        <div class="panel-title">这一刻</div>
        <div class="status">
          <div class="stat"><div class="k">米洛</div><div class="v" id="miloRel">陌生</div></div>
          <div class="stat"><div class="k">诺拉</div><div class="v" id="noraRel">陌生</div></div>
          <div class="stat"><div class="k">绒团团</div><div class="v" id="rabbitRel">观察中</div></div>
        </div>
        <div class="panel-title" style="margin-top:14px">最近发生</div>
        <div class="log" id="log"></div>
      </aside>
    </div>

    <div class="footer-row">
      <button class="btn soft" id="profileBtn">玩家</button>
      <button class="btn soft" id="memoryBtn">记忆</button>
      <button class="btn soft" id="resetBtn">重新开始</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title" id="sheetTitle">玩家</div>
      <button class="x" id="closeSheet">×</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY='7days_mvp_v1';
const clone=o=>JSON.parse(JSON.stringify(o));

const initialState={
  version:1,
  started:false,
  player:{name:'',gender:'',nickname:''},
  week:1,
  day:0,
  time:0,
  location:'home',
  homeScene:'movein',
  miloRel:0,
  noraRel:0,
  rabbitRel:0,
  flags:{},
  memories:[],
  log:[],
  endDay:false,
  anomalySeen:false
};
let state=clone(initialState);
let currentSheet='';

const el=id=>document.getElementById(id);
function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  el('saveStatus').textContent='已保存';
}
function load(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(raw){try{state=Object.assign(clone(initialState),JSON.parse(raw));}catch(e){state=clone(initialState)}}
}
function toast(msg){
  const t=el('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.classList.remove('show'),1800);
}
function addLog(text,tag='日常'){
  state.log.unshift({text,tag,time:formatTime()});
  state.log=state.log.slice(0,16);
}
function addMemory(text){
  if(!state.memories.includes(text)) state.memories.push(text);
}
function relText(v){
  if(v<=0) return '刚认识';
  if(v<=2) return '有点熟';
  if(v<=4) return '熟悉';
  if(v<=6) return '信任';
  return '特别亲近';
}
function formatTime(){
  if(state.day===0) return 'MOVE-IN';
  const base=8*60+30+state.time;
  const h=Math.floor(base/60)%24, m=base%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function advance(mins){
  if(state.day===0) return;
  state.time+=mins;
  if(state.time>15*60+30) state.time=15*60+30;
}
function peopleHtml(names){
  const map={milo:['milo','米洛','米'],nora:['nora','诺拉','诺'],rabbit:['rabbit','绒团团','绒'],player:['player',state.player.name||'你','你']};
  return names.map(k=>{const [cls,name,letter]=map[k];return `<div class="avatar-wrap"><div class="avatar ${cls}">${letter}</div><div class="name">${name}</div></div>`}).join('');
}
function setScene({location,title,desc,people=['milo','nora','rabbit'],quote=''}){
  el('sceneLocation').textContent=location;
  el('sceneTitle').textContent=title;
  el('sceneDesc').textContent=desc;
  el('people').innerHTML=peopleHtml(people);
  const q=el('quote');
  if(quote){q.textContent=quote;q.classList.remove('hidden')}else{q.textContent='';q.classList.add('hidden')}
}
function renderLog(){
  el('log').innerHTML=state.log.length?state.log.map(x=>`<div class="entry"><small>${x.time} · ${x.tag}</small>${escapeHtml(x.text)}</div>`).join(''):'<div class="tiny">还没有留下什么记录。</div>';
}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function updateStatus(){
  el('weekDay').textContent=`WEEK ${state.week} · DAY ${state.day}`;
  el('clock').textContent=formatTime();
  el('miloRel').textContent=relText(state.miloRel);
  el('noraRel').textContent=relText(state.noraRel);
  el('rabbitRel').textContent=state.rabbitRel<=1?'观察中':state.rabbitRel<=3?'熟悉了':'……它好像很了解你';
}
function render(){
  updateStatus(); renderLog();
  if(!state.started){renderIntro();return;}
  if(state.day===0){renderDay0();return;}
  if(state.endDay){renderDayComplete();return;}
  renderDay1();
  save();
}
function renderIntro(){
  setScene({location:'新生活开始之前',title:'先告诉我你是谁',desc:'这个版本先只做一个很小的入口：你的名字、你希望怎么称呼自己，以及第一次搬进这间公寓。之后的一切，都会从这里开始。',people:['rabbit']});
  el('actions').innerHTML=`<button class="btn primary" id="startBtn"><div class="label">开始搬家</div><div class="sub">进入 WEEK 1 · DAY 0</div></button>`;
  el('startBtn').onclick=openProfileSetup;
}
function renderDay0(){
  setScene({location:'公寓 · 门口',title:'搬进来',desc:'你站在一扇不算新的门前。门后有人在打游戏。厨房里传来杯子碰到台面的声音。最奇怪的是——一只兔子正从门缝里看你。',people:['milo','nora','rabbit'],quote:'绒团团：“你终于来啦。૮₍˶ᵔ ᵕ ᵔ˶₎ა”'});
  el('actions').innerHTML=`
    <button class="btn primary" data-act="enterHome"><div class="label">推门进去</div><div class="sub">正式开始共同生活</div></button>
    <button class="btn" data-act="talkMilo"><div class="label">先看米洛</div><div class="sub">他似乎正在打游戏</div></button>
    <button class="btn" data-act="talkNora"><div class="label">先看诺拉</div><div class="sub">厨房有人</div></button>
    <button class="btn soft" data-act="petRabbit"><div class="label">摸摸绒团团</div><div class="sub">它好像不太在意</div></button>`;
  bindActions();
}
function renderDay1(){
  if(!state.flags.day1Intro){state.flags.day1Intro=true;addLog('第一天真正开始了。你发现这里的人不会等着你点击才行动。','DAY 1');addMemory('第一次真正搬进公寓的早晨。');}
  const t=8*60+30+state.time;
  let locText=state.location==='home'?'公寓':'城市 · '+state.location;
  let title='一个普通的早晨';
  let desc='你醒来后，房子已经开始自己运转。';
  let quote='';
  let people=['milo','nora','rabbit'];
  if(state.location==='home'){
    if(t<10*60){title='厨房里已经有人';desc='诺拉在厨房找东西。米洛的房间门还是关着的。绒团团已经开始惦记早餐。';quote='诺拉：“早。你先忙你的，不用管我。”';}
    else if(t<13*60){title='午前的空档';desc='米洛终于醒了。手机里的消息很多，但他好像一点都不急。';quote='米洛：“等一下，我马上就好。”';}
    else if(t<17*60){title='下午没有人催你';desc='这是最适合出门、发呆、或者随便看看这座城市的时间。';quote='绒团团：“你可以出去呀。又没人关门。”';}
    else if(t<20*60){title='天快黑了';desc='公寓慢慢安静下来。你开始注意到，三个人的生活节奏其实差得很远。';people=['player','milo','nora','rabbit'];}
    else {title='夜里';desc='灯光比白天柔和很多。你本来只是想倒杯水。';people=['player','rabbit'];}
  }else{
    people=['player'];
    if(state.location==='便利店'){title='便利店';desc='冷柜的灯很亮。你顺手拿了一样本来没打算买的东西。';}
    if(state.location==='咖啡店'){title='咖啡店';desc='窗边还有一个空位。手机没有催你，你也不需要马上回去。';}
    if(state.location==='商场'){title='商场';desc='人很多。你在某个橱窗前停了一会儿。';}
    if(state.location==='街道'){title='街道';desc='风有点凉。城市没有因为你离开公寓而停下来。';}
  }
  setScene({location:locText,title,desc,people,quote});
  el('actions').innerHTML=buildActions();
  bindActions();
  if(state.location==='home' && t>=22*60 && !state.anomalySeen){
    const btn=document.querySelector('[data-act="anomaly"]'); if(btn){btn.classList.add('primary')}
  }
}
function buildActions(){
  const t=8*60+30+state.time;
  const arr=[];
  if(state.location==='home'){
    arr.push(btn('talkMilo','找米洛','看看他在干什么'));
    arr.push(btn('talkNora','找诺拉','她可能在厨房 / 客厅'));
    arr.push(btn('rabbit','陪绒团团','它今天盯着什么呢'));
    arr.push(btn('phone','看手机','看看有没有新消息'));
    if(t<20*60) arr.push(btn('city','出去走走','去城市里待一会儿'));
    if(t>=20*60) arr.push(btn('anomaly','夜里倒水','你只是想去厨房'));
    if(t>=21*60) arr.push(btn('sleep','睡觉','结束今天的自由行动'));
  }else{
    arr.push(btn('returnHome','回公寓','看看他们在干什么'));
    arr.push(btn('stay','再逛一会儿','再给自己一点时间'));
  }
  return arr.join('');
}
function btn(id,label,sub,cl=''){return `<button class="btn ${cl}" data-act="${id}"><div class="label">${label}</div><div class="sub">${sub}</div></button>`}
function bindActions(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handleAction(b.dataset.act));}
function handleAction(act){
  if(act==='enterHome'){state.day=1;state.time=0;state.location='home';addLog('你推开门，正式开始住进来。','DAY 0');state.miloRel=1;state.noraRel=1;state.rabbitRel=1;state.flags.miloMet=true;state.flags.noraMet=true;state.flags.rabbitMet=true;toast('WEEK 1 · DAY 1');}
  else if(act==='talkMilo'){talkMilo();}
  else if(act==='talkNora'){talkNora();}
  else if(act==='petRabbit'||act==='rabbit'){rabbitEvent();}
  else if(act==='city'){openCity();return;}
  else if(act==='returnHome'){state.location='home';advance(30);addLog('你回到公寓。','移动');maybeEvent('homeReturn');}
  else if(act==='stay'){advance(60);addLog('你又在外面待了一会儿。','移动');maybeEvent('city');}
  else if(act==='phone'){phoneEvent();}
  else if(act==='anomaly'){anomalyEvent();}
  else if(act==='sleep'){endDay();return;}
  render();
}
function talkMilo(){
  const t=8*60+30+state.time;
  if(t<10*60){state.miloRel+=1;addLog('你第一次和米洛正式打招呼。他刚醒，头发乱得不像一个潮男。','米洛');addMemory('米洛的第一印象：看起来很会生活，实际上还在找自己的充电线。');toast('米洛对你的印象变好了');}
  else if(t<14*60){state.miloRel+=1;advance(30);addLog('米洛让你看了一眼他正在玩的游戏，然后信誓旦旦地说“这个我很擅长”。','米洛');}
  else if(t<20*60){advance(45);addLog('你和米洛聊了一会儿。他说了三个“等一下”，最后真的在很久以后才把话题聊完。','米洛');}
  else{state.miloRel+=1;advance(20);addLog('深夜你和米洛说了几句话。他看起来很轻松。','米洛');}
}
function talkNora(){
  const t=8*60+30+state.time;
  if(t<11*60){state.noraRel+=1;advance(15);addLog('诺拉给你让开了厨房的位置。她说话很直接，但并不冷。','诺拉');addMemory('诺拉的第一印象：好看、直接，而且似乎不喜欢别人替她做决定。');}
  else if(t<18*60){state.noraRel+=1;advance(30);addLog('诺拉和你讨论了一件很普通的小事，但她的判断很快。你几乎插不进第二个弯。','诺拉');}
  else{advance(25);addLog('诺拉看了你一眼，问你今天过得怎么样。问完就继续做自己的事。','诺拉');}
}
function rabbitEvent(){
  const t=8*60+30+state.time;
  state.rabbitRel+=1;advance(10);
  if(!state.flags.rabbitFood){state.flags.rabbitFood=true;addLog('绒团团盯着你手里的甜食。它没有问你能不能给，只说：“这个我可以吃吧？”','绒团团');addMemory('绒团团第一次主动向你讨甜食。');}
  else {addLog('你陪绒团团待了一会儿。它突然说了一句你没听懂的话，然后继续吃东西。','绒团团');}
}
function phoneEvent(){advance(15);addLog('你刷了一会儿手机。城市的信息很多，但暂时没有什么必须处理的事。','自由行动');maybeEvent('phone');}
function maybeEvent(kind){
  const t=8*60+30+state.time;
  if(kind==='homeReturn'&&!state.flags.homeReturn){
    state.flags.homeReturn=true;
    if(state.time>220&&state.noraRel>=1){addLog('你回来的时候，客厅里多了一杯饮料。没人解释是谁放的。','小事');}
  }
  if(kind==='city'&&state.location!=='home'&&state.time>=210&&!state.flags.cityTwilight){
    state.flags.cityTwilight=true;addMemory('第一次发现：离开公寓以后，这个世界并不会停下来。');
  }
}
function openCity(){
  openSheet('CITY · 去哪里',`<div class="choice-list">
    <button class="choice" data-place="便利店"><strong>便利店</strong><span>买点东西。最普通、也最容易撞见小事的地方。</span></button>
    <button class="choice" data-place="咖啡店"><strong>咖啡店</strong><span>坐一会儿。时间会慢一点。</span></button>
    <button class="choice" data-place="商场"><strong>商场</strong><span>随便逛逛，也许会看到不该出现在橱窗里的东西。</span></button>
    <button class="choice" data-place="街道"><strong>街道</strong><span>什么也不买，只是走走。</span></button>
  </div>`);
  document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{state.location=b.dataset.place;advance(30);addLog(`你去了${b.dataset.place}。`,'出门');closeSheet();maybeEvent('city');render();});
}
function anomalyEvent(){
  if(state.anomalySeen){toast('你又看见那盏灯了。');return;}
  state.anomalySeen=true;state.rabbitRel+=1;addMemory('DAY 1 深夜：绒团团说，你第一次经过厨房时，这盏灯并没有坏。');
  addLog('你半夜去厨房倒水。绒团团蹲在门边，看了一眼灯：“你第一次从这里走过去的时候，这盏灯不是坏的吗？”','异常');
  openSheet('DAY 1 · 23:58',`<div class="entry"><small>厨房</small>灯亮了一下，又灭掉。</div><p style="line-height:1.8;font-size:15px">你很确定自己没有碰开关。绒团团抬起头，看着你。</p><p style="line-height:1.8;font-size:15px"><strong>绒团团：</strong>“没事呀。”</p><p class="tiny">这是第一颗异常种子。这个版本不会告诉你它到底是什么意思。</p><div class="footer-row"><button class="btn primary" id="anomalyClose">回去睡觉</button></div>`);
  el('anomalyClose').onclick=()=>{closeSheet();render();};
}
function endDay(){
  state.endDay=true;state.time=15*60+30;state.location='home';
  addLog('你决定结束第一天。','DAY 1');addMemory('DAY 1 结束：这间公寓好像比看起来更有故事。');
  render();
}
function renderDayComplete(){
  setScene({location:'WEEK 1 · DAY 1',title:'今天结束了',desc:'第一天没有发生什么惊天动地的事，但你已经开始知道：米洛、诺拉、绒团团都不会等着你点下一步。他们有自己的节奏。',people:['milo','nora','rabbit'],quote:'“有时候，最普通的一天才最容易留下东西。”'});
  el('actions').innerHTML=`
    <button class="btn primary" id="nextPreview"><div class="label">继续到 DAY 2（预览）</div><div class="sub">下一版会在这里继续长出完整事件系统</div></button>
    <button class="btn" id="replayDay"><div class="label">重玩 DAY 1</div><div class="sub">看看另一种选择会发生什么</div></button>`;
  el('nextPreview').onclick=()=>{state.day=2;state.time=0;state.endDay=false;state.location='home';addLog('DAY 2 预览开启。','DAY 2');toast('DAY 2 已进入预览');renderPreviewDay2();};
  el('replayDay').onclick=()=>{state.day=1;state.time=0;state.location='home';state.endDay=false;state.flags=Object.fromEntries(Object.entries(state.flags).filter(([k])=>!['day1Intro'].includes(k)));addLog('你重新回到 DAY 1。','轮回');render();};
}
function renderPreviewDay2(){
  setScene({location:'公寓 · 早晨',title:'DAY 2 预览',desc:'第二天开始。现在只是骨架预览：从这里以后，真正的事件池、关系分支、出门系统和多周目会越来越丰富。',people:['milo','nora','rabbit'],quote:'绒团团：“你真的还回来啦。”'});
  el('actions').innerHTML=`<button class="btn primary" id="backToDay1"><div class="label">返回 DAY 1 重玩</div><div class="sub">先把第一天测试舒服了，再继续扩展</div></button>`;
  el('backToDay1').onclick=()=>{state.day=1;state.time=0;state.location='home';state.endDay=false;render();};
}
function openProfileSetup(){
  openSheet('第一次见面',`<p class="tiny">名字之后可以修改。这里不是人格测试，只是让这个世界知道该怎么叫你。</p>
    <input id="playerName" class="input" maxlength="12" placeholder="你的名字" value="${escapeHtml(state.player.name)}" />
    <div class="panel-title" style="margin-top:14px">你希望怎么称呼自己？</div>
    <div class="gender">
      <button data-g="女">女</button><button data-g="男">男</button><button data-g="不透露">不透露</button>
    </div>
    <div class="footer-row"><button class="btn primary" id="saveProfile">确认</button></div>`);
  document.querySelectorAll('[data-g]').forEach(b=>{if(b.dataset.g===state.player.gender)b.classList.add('active');b.onclick=()=>{document.querySelectorAll('[data-g]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.player.gender=b.dataset.g;}});
  el('saveProfile').onclick=()=>{
    const name=el('playerName').value.trim();
    if(!name){toast('先给自己一个名字吧');return;}
    state.player.name=name; state.started=true; closeSheet(); render();
  };
}
function openSheet(title,body){currentSheet=title;el('sheetTitle').textContent=title;el('sheetBody').innerHTML=body;el('overlay').classList.add('show');}
function closeSheet(){el('overlay').classList.remove('show');}
el('closeSheet').onclick=closeSheet;
el('overlay').addEventListener('click',e=>{if(e.target===el('overlay'))closeSheet();});
el('profileBtn').onclick=()=>{
  if(!state.started){openProfileSetup();return;}
  openSheet('玩家资料',`<div class="entry"><small>你</small><strong>${escapeHtml(state.player.name)}</strong><div class="tiny" style="margin-top:6px">称呼：${escapeHtml(state.player.gender||'不透露')}<br>当前：WEEK ${state.week} · DAY ${state.day}</div></div><div class="footer-row"><button class="btn" id="editName">修改名字</button></div>`);
  el('editName').onclick=()=>openProfileSetup();
};
el('memoryBtn').onclick=()=>{
  if(!state.started){toast('开始游戏后这里会有记录');return;}
  const mem=state.memories.length?state.memories.map((m,i)=>`<div class="entry"><small>MEMORY ${String(i+1).padStart(2,'0')}</small>${escapeHtml(m)}</div>`).join(''):'<div class="tiny">还没有特别的记忆。</div>';
  openSheet('MEMORY',mem);
};
el('resetBtn').onclick=()=>{
  if(confirm('确定要清空这个 MVP 的本地存档吗？')){localStorage.removeItem(STORAGE_KEY);state=clone(initialState);render();toast('已重新开始');}
};
load();render();
</script>
</body>
</html>
