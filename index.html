<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#fff8fb" />
<title>7 DAYS WITH YOUR ROOMMATE</title>
<style>
  :root{
    --bg:#fff8fb;
    --paper:rgba(255,255,255,.90);
    --ink:#2d2a2d;
    --muted:#7d737a;
    --pink:#f38fb0;
    --pink2:#f8c6d7;
    --pink3:#fff0f5;
    --lav:#b8a7d9;
    --line:rgba(69,53,63,.10);
    --shadow:0 18px 50px rgba(74,50,64,.10);
    --radius:28px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:
    radial-gradient(circle at 15% 10%, rgba(243,143,176,.14), transparent 28%),
    radial-gradient(circle at 88% 8%, rgba(184,167,217,.13), transparent 26%),
    var(--bg);
    color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  body{min-height:100vh}
  button{font:inherit}
  .app{width:min(720px,100%);margin:0 auto;padding:18px 16px 36px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{
    width:38px;height:38px;border-radius:14px;background:#fff;border:1px solid var(--line);
    display:grid;place-items:center;box-shadow:0 8px 25px rgba(74,50,64,.07);font-size:20px
  }
  .tiny{font-size:12px;color:var(--muted);letter-spacing:.02em}
  .screen{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:24px 20px}
  .hero{padding:32px 22px 26px;text-align:center}
  h1{margin:0 0 8px;font-size:clamp(30px,8vw,50px);line-height:1.02;letter-spacing:-.04em}
  h2{margin:0 0 8px;font-size:28px;letter-spacing:-.03em}
  h3{margin:0 0 8px;font-size:18px}
  p{line-height:1.65}
  .subtitle{color:var(--muted);font-size:15px;margin:0 auto 20px;max-width:540px}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:var(--pink3);color:#9b536c;font-size:12px;font-weight:700}
  .cta{
    width:100%;padding:15px 16px;border:0;border-radius:18px;background:var(--ink);color:#fff;
    cursor:pointer;box-shadow:0 12px 24px rgba(45,42,45,.16);font-weight:700
  }
  .cta:active{transform:translateY(1px)}
  .ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .stack{display:grid;gap:12px}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .choice{
    padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:left;cursor:pointer;
    transition:.16s ease;min-height:78px
  }
  .choice:hover{transform:translateY(-1px);border-color:rgba(243,143,176,.55);box-shadow:0 10px 22px rgba(74,50,64,.06)}
  .choice.selected{border:2px solid var(--pink);padding:15px;background:#fff8fb}
  .choice small{display:block;color:var(--muted);margin-top:5px;font-size:12px}
  .section{margin-top:16px}
  .tiny-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
  .progress{height:8px;background:rgba(69,53,63,.07);border-radius:999px;overflow:hidden}
  .progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:999px;width:0%}
  .scene{padding:16px;border-radius:20px;background:linear-gradient(180deg,#fff,#fffafb);border:1px solid var(--line)}
  .scene-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .day{font-weight:800}
  .time{color:var(--muted);font-size:12px}
  .bubble{padding:14px 15px;border-radius:18px;background:#fff3f7;border:1px solid rgba(243,143,176,.20);margin:10px 0}
  .choices{display:grid;gap:10px;margin-top:16px}
  .choice-big{
    text-align:left;padding:15px 15px;border-radius:18px;border:1px solid var(--line);background:#fff;cursor:pointer;
  }
  .choice-big:hover{border-color:rgba(243,143,176,.55);background:#fff9fb}
  .choice-letter{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:10px;background:#f8edf2;color:#9b536c;font-weight:800;margin-right:9px}
  .mascot-wrap{display:flex;justify-content:center;margin:8px 0 14px}
  .bunny{
    position:relative;width:140px;height:150px;
  }
  .ear,.body,.tail,.eye,.nose,.cheek,.foot,.innerEar{position:absolute}
  .ear{width:38px;height:88px;background:#fff;border:2px solid #eee5e9;border-radius:28px 28px 18px 18px;top:5px;z-index:1}
  .ear.left{left:26px;transform:rotate(-8deg)}
  .ear.right{right:26px;transform:rotate(8deg)}
  .innerEar{inset:9px 8px auto 8px;height:36px;border-radius:20px;background:#f7a9c2}
  .body{width:104px;height:94px;background:#fff;border:2px solid #eee5e9;border-radius:48% 48% 42% 42%;left:18px;top:53px;box-shadow:0 10px 20px rgba(74,50,64,.08)}
  .eye{width:7px;height:10px;background:#3a3036;border-radius:50%;top:88px}
  .eye.l{left:49px}.eye.r{right:49px}
  .nose{width:8px;height:6px;background:#e990ad;border-radius:50%;left:66px;top:103px}
  .cheek{width:16px;height:8px;border-radius:50%;background:#f6ccd9;top:106px}
  .cheek.l{left:35px}.cheek.r{right:35px}
  .foot{width:28px;height:16px;background:#fff;border:2px solid #eee5e9;border-radius:14px;bottom:6px}
  .foot.l{left:34px}.foot.r{right:34px}
  .tail{width:26px;height:26px;border-radius:50%;background:#f7a9c2;border:2px solid #eee5e9;right:3px;top:94px}
  .bunny.blink .eye{height:2px;top:92px;border-radius:999px}
  .mascot-text{text-align:center;color:var(--muted);font-size:13px}
  .result-card{padding:18px;border-radius:20px;background:#fff;border:1px solid var(--line);margin-top:12px}
  .result-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .tag-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .tag{padding:6px 9px;border-radius:999px;background:#f8f1f4;color:#6b5f66;font-size:12px}
  .memory{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:#fff9fb;border:1px solid rgba(243,143,176,.18);margin-top:9px}
  .memory-icon{font-size:20px}
  .footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
  .hidden{display:none!important}
  .divider{height:1px;background:var(--line);margin:18px 0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:560px){
    .choice-grid,.two{grid-template-columns:1fr}
    .screen{padding:20px 16px}
    .hero{padding:28px 18px 24px}
  }
</style>
</head>

</div>

    options:[

      {text:"“可以，但我们得先定几条规矩。”",mods:{boundaries:7,social:5,relationship:{respect:8,trust:7}},mem:"📋 Last Night：继续，但这次要把规则说清楚。"},
      {text:"“我觉得……还是算了。”",mods:{conflict:5,boundaries:6,relationship:{closeness:-10}},mem:"🚪 Last Night：这一周到这里。"},
      {text:"“你先告诉我，你这几天最受不了我的是什么？”",mods:{social:9,relationship:{trust:10,respect:6}},mem:"🪞 Last Night：你把问题递回给了对方。"}
    ]
  }
];

const randomEvents = [
  {day:2,time:"1:18 PM",title:"草莓警报",text:"米洛/米拉站在冰箱前：“你昨天买的草莓也太好吃了。”\n你看了一眼：只剩两个。",choices:[
    {text:"“吃吧。”",mods:{patience:2,relationship:{closeness:3}},mem:"🍓 草莓警报：最后两个也没了。"},
    {text:"“下次先问我。”",mods:{boundaries:3,social:2,relationship:{respect:2}},mem:"🍓 草莓警报：草莓也开始讲边界。"},
    {text:"把剩下的两个藏起来。",mods:{grudge:3,conflict:1},mem:"🍓 草莓警报：你开启了藏食物时代。"}
  ]},
  {day:3,time:"6:42 PM",title:"快递到了",text:"室友：“我顺手帮你拿了。”\n然后你发现你的包裹被放在了一个非常奇怪的地方。",choices:[
    {text:"谢谢他/她。",mods:{social:2,relationship:{closeness:2}},mem:"📦 快递到了：至少他/她帮你拿了。"},
    {text:"“下次放门口就好。”",mods:{boundaries:2},mem:"📦 快递到了：位置也有规则。"},
    {text:"先去找自己的包裹。",mods:{patience:-1},mem:"📦 快递到了：你开始寻找。"}
  ]},
  {day:5,time:"4:03 PM",title:"米洛/米拉突然请客",text:"室友把一杯饮料放到你桌上。\n“刚好多买了一杯。”",choices:[
    {text:"“谢谢！”",mods:{social:3,relationship:{closeness:5,trust:2}},mem:"🧋 突然请客：刚好多一杯。"},
    {text:"“你怎么知道我喜欢这个？”",mods:{social:4,relationship:{trust:4}},mem:"🧋 突然请客：原来他/她记得。"},
    {text:"“你别又吃错药了。”",mods:{social:2,conflict:1},mem:"🧋 突然请客：你们又开始互相吐槽。"}
  ]},
  {day:6,time:"3:12 PM",title:"绒团团失踪了",text:"你找遍房间都没看到绒团团。\n最后，在一条粉色毛毯里发现了一个很圆的小包。",choices:[
    {text:"把它抱出来。",mods:{social:1,relationship:{closeness:2}},mem:"🐇 绒团团失踪：毛毯案告破。"},
    {text:"戳一下毛毯。",mods:{social:2},mem:"🐇 绒团团失踪：你获得了一只兔子的怒视。"},
    {text:"假装没看到。",mods:{grudge:1},mem:"🐇 绒团团失踪：她自己会出来的。"}
  ]}
];

const endings = [
  {key:"soft",title:"🕊️ 表面和平，内心已经搬走",desc:"你很少制造冲突。你们没有吵架，但你把很多事情藏在了心里。",when:s=>s.stats.conflict<28 && s.stats.grudge>54},
  {key:"property",title:"🔥 我不是室友，我是物业",desc:"你处理了太多公共问题。厨房确实很干净。你的精神也确实很累。",when:s=>s.stats.cleanliness>70 && s.stats.boundaries>62},
  {key:"day3",title:"💀 第三天已经想退租",desc:"你的耐心余额在第三天就开始闪红灯。你的 Wi-Fi 密码还安全吗？",when:s=>s.stats.conflict>66 && s.stats.grudge>60},
  {key:"sync",title:"❤️ 奇迹般地合拍",desc:"你们没有完美解决所有事情，但你们学会了怎么把话说出来。",when:s=>s.relationship.trust>72 && s.relationship.respect>72},
  {key:"besties",title:"🎮 深夜固定队",desc:"你们的共同生活规则有点混乱，但至少有人陪你半夜吃东西、打游戏、出去运动。",when:s=>s.stats.social>72 && s.relationship.closeness>74},
  {key:"roommates",title:"🏠 还行，我们继续住",desc:"你们不是完美室友，但已经找到了一个能继续生活的节奏。",when:s=>s.relationship.trust>55 && s.relationship.closeness>52},
  {key:"cold",title:"🧊 其实我们只是住在一起",desc:"你们没有真正吵起来，但也没有真正靠近。",when:s=>s.relationship.closeness<36},
  {key:"default",title:"🌷 一周结束了。",desc:"你们还在学习怎么一起生活。也许这已经是一个不错的开始。",when:()=>true}
];

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function saveMeta(){
  const meta = {
    playedBefore:true,
    previousEnding:state.previousEnding,
    previousRoommate:state.roommateName
  };
  localStorage.setItem("7days_meta", JSON.stringify(meta));
}
function loadMeta(){
  try{
    const meta=JSON.parse(localStorage.getItem("7days_meta")||"null");
    if(meta && meta.playedBefore){
      state.seenBefore=true;state.previousEnding=meta.previousEnding||null;
    }
  }catch(e){}
}
function resetRun(){
  state.playerGender=null;state.roommateGender=null;state.roommateName=null;
  state.day=1;state.eventIndex=0;state.totalEvents=14;state.currentEventKey=null;
  state.stats={patience:50,boundaries:50,cleanliness:50,conflict:35,social:50,grudge:30};
  state.relationship={trust:50,closeness:50,defensiveness:20,respect:50};
  state.memories=[];
}
function applyMods(mods){
  const keys=["patience","boundaries","cleanliness","conflict","social","grudge"];
  keys.forEach(k=>{ if(mods[k]!==undefined) state.stats[k]=Math.max(0,Math.min(100,state.stats[k]+mods[k])); });
  if(mods.relationship){
    Object.keys(mods.relationship).forEach(k=>state.relationship[k]=Math.max(0,Math.min(100,state.relationship[k]+mods.relationship[k])));
  }
}
function roommatePronoun(){
  return state.roommateGender==="female"?"她":"他";
}
function normalizeText(text){
  return text.replaceAll("他/她",roommatePronoun());
}
function bunnyHtml(){return `
  <div class="mascot-wrap">
    <div class="bunny" id="bunny">
      <div class="ear left"><div class="innerEar"></div></div>
      <div class="ear right"><div class="innerEar"></div></div>
      <div class="body"></div>
      <div class="eye l"></div><div class="eye r"></div><div class="nose"></div>
      <div class="cheek l"></div><div class="cheek r"></div>
      <div class="foot l"></div><div class="foot r"></div>
      <div class="tail"></div>
    </div>
  </div>
`}

function renderStart(){
  $("memoryBadge").textContent = state.seenBefore ? "你回来过 ♡" : "";
  $("appRoot").innerHTML = `
    <section class="screen hero">
      ${bunnyHtml()}
      <div class="pill">${state.seenBefore ? "绒团团好像记得你。" : "A tiny week. A very real roommate."}</div>
      <h1 style="margin-top:12px">7 DAYS<br>WITH YOUR ROOMMATE</h1>
      <p class="subtitle">和室友住一周，你能撑到第几天？<br>每个选择都可能让你的室友更喜欢你，也可能让你离崩溃更近一步。</p>
      <button class="cta" onclick="renderSetup()">开始这一周</button>
      <div class="footer-note">第一版原型 · 没有正确答案</div>
    </section>
  `;
}

function renderSetup(){
  $("appRoot").innerHTML = `
    <section class="screen">
      <div class="tiny">SETUP</div>
      <h2>先认识一下彼此。</h2>
      <p style="color:var(--muted);margin-top:0">你可以选择自己的性别，也可以选择室友的性别。故事的核心会保持一样，但一些细节和台词会变。</p>
      <div class="section">
        <h3>你</h3>
        <div class="choice-grid">
          <button class="choice" data-p="female" onclick="choosePlayer('female',this)">女生<small>继续生活。</small></button>
          <button class="choice" data-p="male" onclick="choosePlayer('male',this)">男生<small>继续生活。</small></button>
        </div>
      </div>
      <div class="section">
        <h3>你的室友</h3>
        <div class="choice-grid">
          <button class="choice" data-r="female" onclick="chooseRoommate('female',this)">米拉<small>漂亮、活泼、爱玩，有点小调皮。</small></button>
          <button class="choice" data-r="male" onclick="chooseRoommate('male',this)">米洛<small>好看、热情、爱运动，永远说“等一下”。</small></button>
        </div>
      </div>
      <div class="section two">
        <button class="cta ghost" onclick="renderStart()">返回</button>
        <button class="cta" onclick="startGame()">搬进来</button>
      </div>
    </section>
  `;
}

function choosePlayer(g,el){
  state.playerGender=g;
  document.querySelectorAll("[data-p]").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
}
function chooseRoommate(g,el){
  state.roommateGender=g;
  state.roommateName=roommateProfiles[g].name;
  document.querySelectorAll("[data-r]").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
}
function startGame(){
  if(!state.playerGender || !state.roommateGender){
    alert("先把你和室友都选好。");
    return;
  }
  resetRun();
  state.playerGender=state.playerGender||"female";
  state.roommateGender=state.roommateGender||"female";
  state.roommateName=roommateProfiles[state.roommateGender].name;
  renderEvent();
}

function getEvent(){
  return mainEvents[state.eventIndex];
}
function maybeInsertRandom(){
  const due = randomEvents.filter(e=>e.day===state.day && !state.memories.some(m=>m.startsWith(e.title)));
  if(!due.length) return null;
  // roughly 45% chance, max one per day
  if(Math.random()>0.45) return null;
  return due[Math.floor(Math.random()*due.length)];
}
function renderEvent(){
  const e=getEvent();
  if(!e){ renderEnding(); return; }
  state.currentEventKey="main_"+state.eventIndex;
  const pct=Math.round((state.eventIndex/state.totalEvents)*100);
  $("appRoot").innerHTML=`
    <section class="screen">
      <div class="tiny-row">
        <div><span class="day">DAY ${e.day}</span><span class="tiny"> · ${esc(e.time)}</span></div>
        <div class="tiny">${state.eventIndex+1} / ${state.totalEvents}</div>
      </div>
      <div class="progress"><span style="width:${pct}%"></span></div>

      <div class="scene section">
        <div class="scene-head">
          <div class="pill">${state.roommateName} · ${roommateProfiles[state.roommateGender].vibe}</div>
        </div>
        <h2>${esc(e.title)}</h2>
        ${e.setup.map(s=>`<p style="margin:6px 0">${esc(normalizeText(s))}</p>`).join("")}
        <div class="bubble">${esc(normalizeText(e.roommate)).replace(/\\n/g,"<br>")}</div>
      </div>

      <div class="section">
        <div class="tiny">你会：</div>
        <div class="choices">
          ${e.options.map((o,i)=>`
            <button class="choice-big" onclick="chooseMain(${i})">
              <span class="choice-letter">${String.fromCharCode(65+i)}</span>${esc(normalizeText(o.text))}
            </button>`).join("")}
        </div>
      </div>
      <div class="footer-note">${state.seenBefore ? "绒团团：……总觉得你已经来过一次。" : "绒团团暂时没有说话。她在看。"} </div>
    </section>
  `;
}

function chooseMain(i){
  const e=getEvent(), o=e.options[i];
  applyMods(o.mods);
  state.memories.push(o.mem);
  state.eventIndex++;
  state.day = e.day===7 ? 7 : e.day;
  const maybe=maybeInsertRandom();
  if(maybe){ renderRandom(maybe); }
  else { setTimeout(renderEvent,50); }
}

function renderRandom(e){
  $("appRoot").innerHTML=`
    <section class="screen">
      <div class="tiny">RANDOM MOMENT · ${esc(e.time)}</div>
      <h2 style="margin-top:8px">${esc(e.title)}</h2>
      <div class="scene section">
        ${esc(normalizeText(e.text)).replace(/\\n/g,"<br>")}
      </div>
      <div class="choices section">
        ${e.choices.map((o,i)=>`
          <button class="choice-big" onclick="chooseRandom(${i},${JSON.stringify(e.title)})">
            <span class="choice-letter">${String.fromCharCode(65+i)}</span>${esc(normalizeText(o.text))}
          </button>`).join("")}
      </div>
      <div class="footer-note">${bunnyLine()}</div>
    </section>`;
}
function bunnyLine(){
  const lines = [
    "绒团团：我只是路过。",
    "绒团团：这个我不评价。",
    "绒团团：……挺有意思。",
    "绒团团：我想吃甜的。",
    "绒团团：你确定？"
  ];
  return lines[(state.eventIndex+state.day)%lines.length];
}
function chooseRandom(i,title){
  const due=randomEvents.find(e=>e.title===title);
  const o=due.choices[i];
  applyMods(o.mods); state.memories.push(o.mem);
  renderEvent();
}

function statKeywords(){
  const tags=[];
  const s=state.stats, r=state.relationship;
  if(s.patience>62) tags.push("很能忍");
  else if(s.patience<38) tags.push("耐心有限");
  if(s.boundaries>64) tags.push("边界感清楚");
  else if(s.boundaries<38) tags.push("容易说“都可以”");
  if(s.cleanliness>64) tags.push("对生活细节敏感");
  if(s.conflict>62) tags.push("不怕把话说开");
  else if(s.conflict<30) tags.push("很少主动起冲突");
  if(s.social>68) tags.push("很会拉近距离");
  if(s.grudge>62) tags.push("会记住小事");
  if(r.trust>70) tags.push("会给别人机会");
  if(r.closeness>70) tags.push("容易和人熟起来");
  return [...new Set(tags)].slice(0,5);
}
function pickEnding(){
  for(const e of endings){
    if(e.when(state)) return e;
  }
  return endings[endings.length-1];
}
function roommateView(){
  const r=state.relationship, s=state.stats;
  if(r.respect>72 && r.closeness>68) return "“我一开始以为你很难懂。后来发现，你只是很在意自己的空间。跟你住，我学会了先问一句。”";
  if(r.trust>70 && s.social>66) return "“你真的挺好玩的。你嘴上有时候很冷静，结果最后总会跟我一起去吃东西。”";
  if(s.boundaries>68 && s.grudge<48) return "“你其实很好沟通。你会告诉我你不舒服，但你不会把我当成坏人。”";
  if(s.grudge>68) return "“我后来才发现，你说‘没事’的时候，有时候其实不是没事。”";
  if(r.closeness<40) return "“我猜你需要很多自己的时间。我其实一直不知道该不该打扰你。”";
  return "“我觉得你挺好相处的。我们不是完全一样的人，但好像已经找到了一点自己的节奏。”";
}
function selfView(){
  const s=state.stats;
  if(s.boundaries>68 && s.social>62) return "你不是害怕冲突。你只是更愿意把话说清楚，而不是让小事慢慢堆起来。";
  if(s.grudge>68 && s.conflict<35) return "你看起来很平静，但你记得的事情，比别人想象中多。";
  if(s.patience>70) return "你对别人很宽容。你的危险区是：有时候，你把自己的感受排在太后面。";
  if(s.conflict>68) return "你不太喜欢憋着。对你来说，关系可以有摩擦，但最好把事情说清楚。";
  return "你这一周没有特别“完美”。但你一直在试着找到一种既照顾自己、又不伤害别人的方式。";
}
function renderEnding(){
  const ending=pickEnding();
  state.previousEnding=ending.key;
  saveMeta();
  const tags=statKeywords();
  let bunny = state.seenBefore
    ? "“你又来了。”<br><br>“我就知道。”"
    : "“嗯。”<br><br>“你这周还活着。”";
  if(ending.key==="sync") bunny="“这次还不错。”<br><br>“至少你们真的聊了。”";
  else if(ending.key==="soft") bunny="“你说了很多次没关系。”<br><br>“我都记下来了。”";
  else if(ending.key==="day3") bunny="“我建议你休息一下。”<br><br>“你的室友也是。”";
  else if(ending.key==="besties") bunny="“你们又组队了？”<br><br>“……行吧。”";

  $("appRoot").innerHTML=`
    <section class="screen">
      <div class="pill">WEEK COMPLETE</div>
      <h2 style="margin-top:10px">${esc(ending.title)}</h2>
      <p style="color:var(--muted);margin-top:4px">${esc(ending.desc)}</p>

      <div class="result-card">
        <div class="result-title"><div><h3>🐇 绒团团观察记录</h3></div><span class="tiny">about you</span></div>
        <p>${esc(selfView())}</p>
        <div class="tag-row">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      </div>

      <div class="result-card">
        <div class="result-title"><div><h3>👀 ${esc(state.roommateName)}眼里的你</h3></div><span class="tiny">roommate view</span></div>
        <p>${esc(roommateView())}</p>
      </div>

      <div class="result-card">
        <div class="result-title"><div><h3>📦 OUR WEEK</h3></div><span class="tiny">memories</span></div>
        ${state.memories.slice(-5).map(m=>`<div class="memory"><div class="memory-icon">${m.split(" ")[0]}</div><div>${esc(m.substring(m.indexOf(" ")+1))}</div></div>`).join("")}
      </div>

      <div class="result-card" style="background:#fff5f8">
        <div class="result-title"><div><h3>💌 这一周以后</h3></div><span class="tiny">one more thing</span></div>
        <p>${esc(finalMessage())}</p>
      </div>

      <div class="result-card">
        <div class="mascot-text">${bunny}</div>
      </div>

      <div class="section two">
        <button class="cta ghost" onclick="renderStart()">回到首页</button>
        <button class="cta" onclick="playAgain()">再住一周</button>
      </div>

      <div class="footer-note">本轮已经留在这台设备里。下一次回来，绒团团可能会记得你。</div>
    </section>`;
}
function finalMessage(){
  const r=state.relationship,s=state.stats,rg=state.roommateGender;
  if(r.trust>75 && r.closeness>72) return `“如果真的要再住一周，我觉得${state.roommateName}大概还是会选你。”`;
  if(s.grudge>70) return `“有些事情你没有当面说，但它们还是留下来了。下次也许可以早点说。”`;
  if(s.boundaries>70) return `“你让${state.roommateName}学会了先问一句。”`;
  return `“一周不够认识一个人，但够让你发现：共同生活其实是一种练习。”`;
}
function playAgain(){
  const oldName=state.roommateName, oldGender=state.roommateGender, oldPlayer=state.playerGender;
  const seen=state.seenBefore;
  resetRun();
  state.roommateName=oldName;state.roommateGender=oldGender;state.playerGender=oldPlayer;state.seenBefore=true;
  renderEvent();
}
loadMeta();
renderStart();
</script>
</body>
</html>
