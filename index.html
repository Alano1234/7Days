<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>7 DAYS WITH YOUR ROOMMATE · MVP v2</title>
<style>
:root{--bg:#f3efeb;--paper:#fffdfa;--ink:#292625;--muted:#817975;--line:#e6ddd6;--accent:#6d5a70;--soft:#eee7e2;--pink:#ead9df;--shadow:0 18px 45px rgba(45,36,32,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}.app{padding:16px 14px 32px}.shell{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:11px;letter-spacing:.15em;font-weight:800;color:var(--muted)}.save{font-size:10px;color:var(--muted)}.card{background:rgba(255,253,250,.96);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero{padding:18px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.08em;font-weight:800}.time{color:var(--ink);letter-spacing:0}.scene{margin-top:12px;padding:21px;min-height:290px;background:linear-gradient(145deg,#f8f4f0,#fffdfa);position:relative;overflow:hidden}.scene:after{content:"";position:absolute;width:190px;height:190px;right:-55px;top:-60px;border-radius:50%;background:rgba(181,138,154,.12)}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:800;position:relative}.title{font-size:28px;font-weight:850;margin-top:5px;position:relative}.desc{font-size:15px;line-height:1.8;margin-top:9px;position:relative;max-width:650px}.quote{margin-top:16px;padding:13px 14px;background:rgba(255,255,255,.76);border:1px solid var(--line);border-radius:16px;font-size:14px;line-height:1.65;position:relative}.people{display:flex;gap:10px;margin-top:18px;position:relative}.person{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.68);border:1px solid var(--line);border-radius:999px;padding:6px 10px 6px 6px;font-size:11px;font-weight:800}.avatar{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;font-size:12px}.m{background:#ece4ef}.n{background:#eee7dc}.r{background:#f1edf5}.p{background:#eee8e2}.layout{display:grid;gap:12px;margin-top:12px}.panel{padding:16px}.section-title{font-size:12px;font-weight:850;color:var(--muted);letter-spacing:.08em;margin-bottom:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px 12px;text-align:left;color:var(--ink);transition:.12s}.btn:active{transform:scale(.985)}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.soft{background:var(--soft)}.label{font-weight:850;font-size:14px}.sub{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}.primary .sub{color:#d9d2d0}.slots{display:flex;gap:7px;margin-bottom:11px}.slot{flex:1;border:1px solid var(--line);border-radius:13px;padding:9px;background:#fcfaf8}.slot.on{background:var(--ink);color:#fff}.slot small{display:block;font-size:9px;opacity:.7}.slot b{font-size:11px}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:10px;border:1px solid var(--line);border-radius:14px;background:#fcfaf8}.stat small{display:block;color:var(--muted);font-size:9px}.stat b{font-size:12px}.log{display:flex;flex-direction:column;gap:8px;max-height:250px;overflow:auto}.entry{border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12px;line-height:1.55;background:#fff}.entry small{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}.footer{display:flex;gap:8px;margin-top:12px}.footer .btn{flex:1;text-align:center}.overlay{position:fixed;inset:0;background:rgba(25,22,21,.45);display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:20}.overlay.show{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:25px 25px 15px 15px;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheettitle{font-size:20px;font-weight:850}.x{border:1px solid var(--line);background:#fff;border-radius:50%;width:38px;height:38px}.choices{display:grid;gap:9px}.choice{border:1px solid var(--line);background:#fff;border-radius:17px;padding:14px;text-align:left}.choice strong{display:block;font-size:14px}.choice span{display:block;font-size:11px;color:var(--muted);line-height:1.55;margin-top:4px}.input{width:100%;padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff;outline:0}.tiny{font-size:11px;color:var(--muted);line-height:1.65}.progress{height:5px;background:var(--soft);border-radius:999px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:var(--accent);width:0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);opacity:0;background:#292625;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;transition:.2s;z-index:30;max-width:90%}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){.layout{grid-template-columns:1.15fr .85fr}.actions{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="app"><div class="shell">
<div class="top"><div class="brand">7 DAYS WITH YOUR ROOMMATE</div><div class="save" id="save">未保存</div></div>
<section class="card hero"><div class="meta"><span id="weekday">PROLOGUE</span><span id="clock">—</span></div><div class="scene"><div class="eyebrow" id="loc">新城市 · 临时公寓</div><div class="title" id="title">搬进来之前</div><div class="desc" id="desc"></div><div class="quote" id="quote"></div><div class="people" id="people"></div></div></section>
<div id="game" class="layout"><section class="card panel"><div class="section-title" id="actionTitle">你现在可以做什么</div><div class="slots" id="slots"></div><div class="actions" id="actions"></div></section><aside class="card panel"><div class="section-title">这一周</div><div class="status"><div class="stat"><small>米洛</small><b id="mr">陌生</b></div><div class="stat"><small>诺拉</small><b id="nr">陌生</b></div><div class="stat"><small>绒团团</small><b id="rr">观察你</b></div></div><div class="section-title" style="margin-top:14px">最近发生</div><div class="log" id="log"></div></aside></div>
<div class="footer"><button class="btn soft" id="profile">玩家</button><button class="btn soft" id="memory">记忆</button><button class="btn soft" id="reset">重新开始</button></div>
</div></div>
<div class="overlay" id="overlay"><div class="sheet"><div class="sheethead"><div class="sheettitle" id="sheetTitle"></div><button class="x" id="close">×</button></div><div id="sheetBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='7days_mvp_v2';
const fresh=()=>({version:2,started:false,player:{name:'',gender:'',prefs:[]},week:1,day:0,block:0,location:'home',actionUsed:false,flags:{},rel:{m:0,n:0,r:0},mem:[],log:[],eventCount:{},seen:{},ending:false});
let s=fresh();const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(s));$('save').textContent='已保存'}function load(){try{let x=localStorage.getItem(KEY);if(x)s=Object.assign(fresh(),JSON.parse(x))}catch(e){s=fresh()}}
function toast(x){let t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}
function log(text,tag='日常'){s.log.unshift({text,tag,time:clock()});s.log=s.log.slice(0,18)}function mem(x){if(!s.mem.includes(x))s.mem.push(x)}
function clock(){if(s.day===0)return 'MOVE-IN';let starts=['08:30','12:30','17:30','22:30'];return starts[Math.min(s.block,3)]}
function rel(v){return v<=0?'陌生':v===1?'刚认识':v<=3?'有点熟':v<=5?'熟悉':v<=7?'信任':'很亲近'}
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setScene(loc,title,desc,quote,people=['m','n','r']){$('loc').textContent=loc;$('title').textContent=title;$('desc').textContent=desc;$('quote').innerHTML=quote||'';$('people').innerHTML=people.map(p=>({m:['米洛','m','M'],n:['诺拉','n','N'],r:['绒团团','r','团'],p:[s.player.name||'你','p','你']}[p])).map(a=>`<div class="person"><i class="avatar ${a[1]}">${a[2]}</i>${esc(a[0])}</div>`).join('')}
function slotName(){return ['上午','下午','晚上','深夜'][s.block]||'结束'}
function render(){
 if(!s.started){renderIntro();return}
 if(s.day===0){renderMoveIn();return}
 if(s.ending){renderEnd();return}
 $('weekday').textContent=`WEEK ${s.week} · DAY ${s.day}`;$('clock').textContent=clock();$('mr').textContent=rel(s.rel.m);$('nr').textContent=rel(s.rel.n);$('rr').textContent=s.rel.r>3?'它好像喜欢你':'观察你';
 $('slots').innerHTML=['上午','下午','晚上','深夜'].map((x,i)=>`<div class="slot ${i===s.block?'on':''}"><small>TIME</small><b>${x}</b></div>`).join('');
 $('log').innerHTML=s.log.map(x=>`<div class="entry"><small>${esc(x.tag)} · ${esc(x.time)}</small>${esc(x.text)}</div>`).join('');
 if(s.actionUsed){setScene(s.location==='home'?'公寓':'城市 · '+s.location,'这一段时间过去了','你已经做过一个主要行动。现在可以结束这个时间段，看看接下来谁会出现。','');$('actions').innerHTML=`<button class="btn primary" data-a="next"><div class="label">进入${s.block<3?slotNameFor(s.block+1):'明天'}</div><div class="sub">时间继续向前走</div></button>`;bind();return}
 renderBlock();save()
}
function slotNameFor(i){return ['上午','下午','晚上','深夜'][i]||'下一天'}
function renderIntro(){
 $('weekday').textContent='PROLOGUE';$('clock').textContent='—';setScene('新城市 · 临时公寓','在搬进去之前','你刚来到这座城市。原本只是打算先住一阵子，等找到真正适合自己的地方。','但房东说了一句话，让你有点在意：<br><strong>“这里的人都挺好相处的。至少以前是。”</strong>',[]);
 $('actions').innerHTML=`<button class="btn primary" data-a="startProfile"><div class="label">先做一点准备</div><div class="sub">不是人格测试，只是让这个世界认识你</div></button>`;$('slots').innerHTML='';$('log').innerHTML='<div class="entry"><small>PROLOGUE</small>你还没有搬进去。</div>';bind();}
function renderMoveIn(){
 $('weekday').textContent='WEEK 1 · DAY 0';$('clock').textContent='MOVE-IN';setScene('公寓 · 门口','你终于到了','你拖着行李站在门口。你在这座城市暂时没有太多认识的人，而这套公寓是你找到的一个短期落脚处。','房东说：<br><strong>“先住一周。觉得合适，就继续住。”</strong><br>你按下门铃。里面立刻传来一句：“等一下——！”',['p']);
 $('actions').innerHTML=`<button class="btn primary" data-a="enter"><div class="label">推门进去</div><div class="sub">正式认识米洛、诺拉和绒团团</div></button>`;$('slots').innerHTML='';bind();}
function renderBlock(){
 $('weekday').textContent=`WEEK ${s.week} · DAY ${s.day}`;$('clock').textContent=clock();let b=s.block;
 if(s.location!=='home'){setScene('城市 · '+s.location,'你还在外面','你没有急着回去。城市不会因为你离开公寓就暂停。','你开始意识到：<br><strong>住进一个地方，也意味着开始拥有属于自己的路线。</strong>',['p']);$('actions').innerHTML=`<button class="btn" data-a="wander"><div class="label">随便走走</div><div class="sub">不触发特定人物事件，但可能发现小事</div></button><button class="btn primary" data-a="home"><div class="label">回公寓</div><div class="sub">看看他们现在在不在</div></button>`;bind();return}
 if(b===0){setScene('公寓 · 早晨','第一天真正开始了','你醒来的时候，米洛的房门还关着。厨房里传来水声。绒团团已经坐在桌边，盯着你昨晚带来的甜食。','诺拉没有回头：<br><strong>“早。你随便坐。”</strong>',['m','n','r']);$('actions').innerHTML=homeButtons('morn');}
 else if(b===1){setScene('公寓 · 午后','房子开始各自运转','米洛终于出现了。他一边找东西，一边说自己“马上就好”。诺拉已经出门了一趟。','米洛：“我就出去十分钟。”<br>绒团团：“他上次也这么说。”',['m','r']);$('actions').innerHTML=homeButtons('aft');}
 else if(b===2){setScene('公寓 · 傍晚','天快黑了','这是最容易发生事情的时间。有人准备出去，有人刚回来，也有人决定什么都不做。','你今天还没有真正决定：<br><strong>你想和谁更熟一点？</strong>',['m','n','r']);$('actions').innerHTML=homeButtons('eve');}
 else {setScene('公寓 · 深夜','所有声音都小了','米洛回了房间。诺拉也不在客厅。绒团团却没有睡。','它看着你：<br><strong>“你今天第一次来这里的时候，有没有觉得这房子有点奇怪？”</strong>',['r']);$('actions').innerHTML=homeButtons('night')}
 bind();}
function homeButtons(kind){let a=[];if(kind==='morn'){a.push(B('milo','找米洛','看看他到底几点起床'));a.push(B('nora','和诺拉一起吃点东西','先从最普通的聊天开始'));a.push(B('rabbit','给绒团团一点甜食','它盯你已经很久了'));a.push(B('city','自己出门','去城市里走一圈'));}
if(kind==='aft'){a.push(B('milo','陪米洛做点事','可能是游戏，也可能是他临时起意的东西'));a.push(B('nora','出去找诺拉','她可能在咖啡店 / 商场'));a.push(B('city','自己安排下午','不围着任何人转'));a.push(B('phone','看手机','看看有没有人联系你'));}
if(kind==='eve'){a.push(B('milo','和米洛吃点东西','看看他今天有没有记住你的喜好'));a.push(B('nora','和诺拉聊一会儿','她今天似乎有点累'));a.push(B('rabbit','陪绒团团','它好像又知道了一件不该知道的事'));a.push(B('city','出去透气','夜里的城市和白天不一样'));}
if(kind==='night'){a.push(B('anomaly','去厨房倒水','你只是想看看那盏灯'));a.push(B('milo','敲米洛的门','他大概还没睡'));a.push(B('nora','找诺拉','她可能还醒着'));a.push(B('next','今天到这里','结束这一天'));}return a.join('')}
function B(a,l,sub){return `<button class="btn" data-a="${a}"><div class="label">${l}</div><div class="sub">${sub}</div></button>`}
function bind(){document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>act(x.dataset.a))}
function useAction(){s.actionUsed=true;save()}
function act(a){
 if(a==='startProfile'){profileQuiz(0);return}
 if(a==='enter'){s.day=1;s.block=0;s.location='home';s.actionUsed=false;s.rel={m:1,n:1,r:1};s.flags.m=true;s.flags.n=true;s.flags.r=true;log('你推开门，正式住进来。','DAY 0');mem('第一次搬进这套公寓。');render();return}
 if(a==='next'){advanceBlock();return}
 if(a==='milo'){useAction();s.rel.m=Math.min(10,s.rel.m+1);log(s.block===0?'米洛终于开门。他头发乱得和“潮男”这个词没有任何关系。':'你和米洛一起待了一会儿。他嘴上说自己很擅长，实际上一半时间都在找东西。','米洛');mem('米洛：看起来很会生活，实际生活管理能力值得怀疑。');render();return}
 if(a==='nora'){useAction();s.rel.n=Math.min(10,s.rel.n+1);log(s.block===1?'你在外面找到诺拉。她没有问你为什么来，只是把手里的东西递给你。':'你和诺拉聊了一会儿。她说话很直接，但会记得你刚才说过的小细节。','诺拉');mem('诺拉：直接、漂亮，而且不太喜欢别人替她做决定。');render();return}
 if(a==='rabbit'){useAction();s.rel.r=Math.min(10,s.rel.r+1);if(!s.flags.food){s.flags.food=true;log('绒团团盯着你的甜食：“我可以吃吧？”它根本没有等待你的回答。','绒团团');mem('绒团团第一次向你讨甜食。')}else log('绒团团吃完以后认真告诉你：“你今天心情没有昨天好。”然后继续吃。','绒团团');render();return}
 if(a==='city'){useAction();openCity();return}
 if(a==='phone'){useAction();log('你刷了一会儿手机。一个朋友问你：“新地方怎么样？”你盯着屏幕想了几秒。','自由');render();return}
 if(a==='wander'){useAction();log('你在'+s.location+'附近随便走了走。你没有特意寻找什么，但记住了一条回家的路。','出门');render();return}
 if(a==='home'){s.location='home';s.actionUsed=false;log('你回到公寓。门一关上，里面的声音又回来了。','回家');render();return}
 if(a==='anomaly'){useAction();if(!s.flags.anomaly){s.flags.anomaly=true;mem('DAY 1：绒团团似乎知道厨房那盏灯以前的状态。');log('你半夜去厨房。灯亮了一下。绒团团盯着灯：“奇怪，它明明昨天才坏掉。”','异常');sheet('23:58 · 厨房',`<p>你没有碰开关。</p><p>绒团团也没有解释。</p><p><strong>“睡吧。”</strong></p><p class="tiny">第一颗异常种子。现在不要问它为什么知道。</p><button class="btn primary" id="ok">回去</button>`)}else {log('绒团团看着那盏灯：“你又来看它啦？”','异常');render()}return}
 if(a==='next'){advanceBlock()}
}
function advanceBlock(){if(s.block<3){s.block++;s.actionUsed=false;s.location='home';if(s.block===1)log('午后开始。','时间');if(s.block===2)log('天快黑了。','时间');if(s.block===3)log('夜深了。','时间');render()}else endDay()}
function endDay(){log('你结束了第一天。','DAY 1');mem('DAY 1：第一次真正开始共同生活。');s.ending=true;render()}
function renderEnd(){setScene('WEEK 1 · DAY 1','第一天结束','你今天只看到了这个家的一小部分。你也发现：如果你一直只等别人来找你，很多事情就不会发生。','<strong>明天，你可以试着去找他们。</strong>',['m','n','r']);$('actions').innerHTML=`<button class="btn primary" data-a="continueDay2"><div class="label">继续 DAY 2</div><div class="sub">下一阶段开始加入更多人物事件</div></button><button class="btn" data-a="replay"><div class="label">重新体验 DAY 1</div><div class="sub">换一种生活方式</div></button>`;bind()}
function profileQuiz(i){let qs=[['你搬家时，最舍不得忘记带什么？',[['耳机','music'],['游戏机','game'],['书 / 笔记本','quiet'],['零食','sweet']]],['第一晚你更想做什么？',[['出去逛一圈','explore'],['待在房间整理东西','quiet'],['找人聊天','social'],['直接睡觉','sleep']]],['有人临时约你出门，你通常？',[['看心情','flex'],['如果有趣就去','explore'],['大概率会去','social'],['先问清楚干什么','quiet']]],['你更容易记住别人什么？',[['说过的话','memory'],['喜欢的东西','care'],['奇怪的小习惯','observe'],['对我的态度','emotion']]]];if(i>=qs.length){s.started=true;s.player.name=s.player.name||'你';s.day=0;log('你完成了搬家前的小准备。系统会记住这些偏好，但不会把它们变成一个人格分数。','系统');mem('搬家前：系统记住了我的生活偏好。');close();renderMoveIn();save();return}let q=qs[i];sheet('搬家前 · '+(i+1)+' / '+qs.length,`<p style="font-size:18px;font-weight:850;line-height:1.5">${q[0]}</p><div class="progress"><i style="width:${i/qs.length*100}%"></i></div><div class="choices">${q[1].map((x,j)=>`<button class="choice" data-q="${j}"><strong>${x[0]}</strong><span>这不是测试结果，只会悄悄影响之后你遇见的某些事情。</span></button>`).join('')}</div>`);document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{s.player.prefs.push(q[1][+b.dataset.q][1]);profileQuiz(i+1)})}
function openCity(){sheet('出去以后，你想去哪？',`<div class="choices"><button class="choice" data-place="便利店"><strong>便利店</strong><span>买点东西，也许顺手记住某个口味。</span></button><button class="choice" data-place="咖啡店"><strong>咖啡店</strong><span>坐一会儿。诺拉有时会来。</span></button><button class="choice" data-place="商场"><strong>商场</strong><span>随便逛。米洛对这里的店似乎很熟。</span></button><button class="choice" data-place="街道"><strong>街道</strong><span>什么都不做，只走走。</span></button></div>`);document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{s.location=b.dataset.place;s.actionUsed=false;log('你去了'+b.dataset.place+'。','出门');close();render()})}
function sheet(t,b){$('sheetTitle').textContent=t;$('sheetBody').innerHTML=b;$('overlay').classList.add('show');if($('ok'))$('ok').onclick=()=>{close();render()}}
function close(){$('overlay').classList.remove('show')}
$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()}
$('profile').onclick=()=>{if(!s.started){profileQuiz(0);return}sheet('玩家',`<div class="entry"><small>你</small><strong>${esc(s.player.name)}</strong><div class="tiny">WEEK ${s.week} · DAY ${s.day}</div></div><p class="tiny">已记住的偏好：${s.player.prefs.join('、')||'暂无'}</p>`)}
$('memory').onclick=()=>sheet('MEMORY',s.mem.length?s.mem.map((x,i)=>`<div class="entry"><small>MEMORY ${String(i+1).padStart(2,'0')}</small>${esc(x)}</div>`).join(''):'<p class="tiny">还没有记忆。</p>')
$('reset').onclick=()=>{if(confirm('确定清空本地存档？')){localStorage.removeItem(KEY);s=fresh();render();toast('已重新开始')}}
load();render();
</script></body></html>
