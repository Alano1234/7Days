<style>
:root{--bg:#fff8fb;--paper:#fff;--ink:#2f2b2e;--muted:#877b82;--pink:#ee8faf;--pink2:#f7b4cb;--lav:#b7a6d7;--line:rgba(55,39,47,.10);--shadow:0 18px 55px rgba(64,41,54,.10);--radius:28px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 12% 7%,rgba(238,143,175,.14),transparent 28%),radial-gradient(circle at 90% 5%,rgba(183,166,215,.14),transparent 28%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.app{width:min(760px,100%);margin:auto;padding:14px 15px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:9px}.brand-mark{width:38px;height:38px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 7px 20px rgba(65,45,55,.06);font-size:21px}.brand-title{font-weight:900;letter-spacing:-.02em;font-size:14px}.brand-sub,.tiny{font-size:11px;color:var(--muted)}.screen{background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);overflow:hidden}.pad{padding:22px 18px}.center{text-align:center}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(31px,8vw,54px);line-height:.98;letter-spacing:-.06em;margin-bottom:10px}h2{font-size:29px;line-height:1.08;letter-spacing:-.04em;margin-bottom:8px}h3{font-size:18px;margin-bottom:8px}p{line-height:1.68}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:#fff0f5;color:#98566d;font-size:11px;font-weight:900}.cta{width:100%;border:0;border-radius:18px;padding:14px 16px;background:var(--ink);color:#fff;font-weight:900;box-shadow:0 12px 26px rgba(45,41,44,.15)}.cta.secondary{background:#fff;color:var(--ink);box-shadow:none;border:1px solid var(--line)}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid var(--line);border-radius:20px;background:#fff;padding:15px}.section{margin-top:17px}.choice-card{border:1px solid var(--line);border-radius:20px;background:#fff;padding:16px;text-align:left;min-height:92px}.choice-card.selected{border:2px solid var(--pink);background:#fff7fa;padding:15px}.choice-title{font-weight:900}.choice-note{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}.input{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px 14px;background:#fff;outline:none}.input:focus{border-color:rgba(238,143,175,.7);box-shadow:0 0 0 4px rgba(238,143,175,.10)}.day-card{padding:17px 18px 19px;background:linear-gradient(135deg,#fff1f6,#fff,#f7f1fc);border-bottom:1px solid var(--line)}.day-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.day-label{font-size:12px;letter-spacing:.12em;font-weight:900;color:#a25670}.day-title{font-size:29px;font-weight:900;letter-spacing:-.04em;margin-top:4px}.progress{height:7px;border-radius:999px;background:rgba(55,39,47,.07);overflow:hidden;margin-top:13px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:999px;transition:width .25s ease}.scene{padding:20px 18px}.time-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.event-time{font-size:12px;color:var(--muted)}.event-title{font-size:29px;font-weight:900;letter-spacing:-.04em;margin-bottom:11px}.story p{margin-bottom:9px}.story .quote{padding:12px 14px;border-left:3px solid var(--pink2);background:#fff7fa;border-radius:12px;line-height:1.65}.dialogue{margin-top:14px;padding:14px 15px;border-radius:18px 18px 18px 6px;background:#fff3f7;border:1px solid rgba(238,143,175,.16);line-height:1.65;white-space:pre-line}.dialogue .who{font-weight:900;font-size:12px;color:#95556b;margin-bottom:4px}.choices{display:grid;gap:10px;margin-top:16px}.option{border:1px solid var(--line);border-radius:18px;background:#fff;padding:14px 15px;text-align:left;line-height:1.5}.option:hover{border-color:rgba(238,143,175,.55);background:#fffafc}.letter{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:10px;background:#f8edf2;color:#94566c;font-weight:900;margin-right:9px;vertical-align:middle}.reaction{margin-top:15px;padding:15px;border-radius:18px;background:#fffdfd;border:1px solid var(--line)}.reaction-title{font-weight:900;margin-bottom:5px}.mascot{display:flex;gap:11px;align-items:flex-start;margin-top:16px;padding:12px 13px;border-radius:18px;background:#faf7fc;border:1px solid var(--line)}.bunny{position:relative;width:60px;height:64px;flex:none}.bunny .ear,.bunny .body,.bunny .eye,.bunny .nose,.bunny .tail{position:absolute}.bunny .ear{width:17px;height:41px;background:#fff;border:1.5px solid #eee3e7;border-radius:13px 13px 8px 8px;top:2px}.bunny .ear:after{content:"";position:absolute;inset:5px 4px auto;height:17px;border-radius:10px;background:#f6a6c0}.bunny .ear.l{left:10px;transform:rotate(-8deg)}.bunny .ear.r{right:10px;transform:rotate(8deg)}.bunny .body{left:7px;top:26px;width:46px;height:37px;border-radius:48%;background:#fff;border:1.5px solid #eee3e7;box-shadow:0 6px 11px rgba(60,40,50,.08)}.bunny .eye{width:4px;height:6px;background:#332c31;border-radius:50%;top:43px}.bunny .eye.l{left:20px}.bunny .eye.r{right:20px}.bunny .nose{width:5px;height:4px;background:#e990ad;border-radius:50%;left:27px;top:50px}.bunny .tail{width:16px;height:16px;border-radius:50%;background:#f6a6c0;border:1px solid #eee3e7;right:0;top:40px}.mascot-text{font-size:12px;line-height:1.58;color:#665b62}.transition{text-align:center;padding:38px 22px}.transition .big{font-size:46px;font-weight:950;letter-spacing:-.06em}.activity-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.activity{border:1px solid var(--line);background:#fff;border-radius:19px;padding:15px;text-align:left;min-height:96px}.activity b{display:block;font-size:14px}.activity small{display:block;color:var(--muted);line-height:1.45;margin-top:5px}.meter{display:flex;gap:4px;margin-top:8px}.dot{width:8px;height:8px;border-radius:50%;background:#eadfe4}.dot.on{background:var(--pink)}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:#f7f0f4;color:#6a5d64;font-size:11px;margin:4px 4px 0 0}.secret{padding:14px 15px;border-radius:18px;background:#fff6f9;border:1px solid rgba(238,143,175,.16);margin-top:10px}.secret small{color:#9b6b7d}.memory-list{display:grid;gap:8px;margin-top:10px}.memory{display:flex;gap:9px;padding:11px 12px;border-radius:14px;background:#fff8fa;border:1px solid rgba(238,143,175,.16);font-size:12px;line-height:1.45}.memory .icon{font-size:18px}.result-block{padding:16px;border:1px solid var(--line);border-radius:20px;background:#fff;margin-top:11px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2f2b2e;color:#fff;padding:11px 14px;border-radius:14px;font-size:12px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.18)}.hidden{display:none!important}.small-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.choice-label{font-size:12px;color:var(--muted)}.pill-dark{display:inline-flex;padding:6px 9px;border-radius:999px;background:#f3ecef;font-size:11px;color:#655a61;font-weight:800}@media(max-width:560px){.grid2,.profile-grid,.activity-grid{grid-template-columns:1fr}.pad{padding:20px 15px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><div class="brand-mark">🐇</div><div><div class="brand-title">7 DAYS WITH YOUR ROOMMATE</div><div class="brand-sub">How long can you survive?</div></div></div><div id="returnBadge" class="tiny"></div></div>
  <div id="root"></div>
</div>
<script>
const APP_KEY="7days_v04_game";
const ROOMMATES={
  male:{name:"米洛",pronoun:"他",traits:["松弛","爱游戏","爱运动","拖延","事后会想很多"],flavor:"看起来什么都无所谓。实际上，一句话能在脑子里循环很久。"},
  female:{name:"米拉",pronoun:"她",traits:["爱漂亮","爱社交","调皮","嘴硬","很在意气氛"],flavor:"表面上很会玩，也很会嘴硬。她其实比看起来更在意别人怎么想。"}
};
const DEFAULT={day:1,timeBlock:0,steps:0,playerGender:null,playerName:"",roommateGender:null,roommateName:"",seenEvents:[],history:[],memories:[],likes:[],items:[],secrets:{male:[],female:[],bunny:[],player:[]},rel:{trust:50,closeness:50,respect:50,bunny:50,roommateBunny:45},stats:{patience:50,boundaries:50,social:50,conflict:35,grudge:30},flags:{},playedBefore:false,ending:null,lastBunny:"",lastActivity:""};
let S=loadState();
function loadState(){try{const x=JSON.parse(localStorage.getItem(APP_KEY)||"null");return x?merge(JSON.parse(JSON.stringify(DEFAULT)),x):JSON.parse(JSON.stringify(DEFAULT))}catch{return JSON.parse(JSON.stringify(DEFAULT))}}
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k])a[k]=merge(a[k],b[k]);else a[k]=b[k]}return a}
function save(){try{localStorage.setItem(APP_KEY,JSON.stringify(S))}catch{}}
function esc(s){return String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function rn(){return S.roommateName||ROOMMATES[S.roommateGender]?.name||"米洛"}
function rp(){return ROOMMATES[S.roommateGender]?.pronoun||"他"}
function pName(){return S.playerName||"你"}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function clamp(v){return Math.max(0,Math.min(100,v))}
function apply(mod={}){for(const k of ["patience","boundaries","social","conflict","grudge"]){if(mod[k]!=null)S.stats[k]=clamp(S.stats[k]+mod[k])}for(const k of ["trust","closeness","respect","bunny","roommateBunny"]){if(mod[k]!=null)S.rel[k]=clamp(S.rel[k]+mod[k])}}
function remember(text,icon="✦"){S.memories.push({text,icon});if(S.memories.length>22)S.memories.shift()}
function addLike(v){if(v&&!S.likes.includes(v))S.likes.push(v)}
function addItem(v){if(v&&!S.items.includes(v))S.items.push(v)}
function setFlag(k,v=true){S.flags[k]=v}
function eventKey(e){return e.id+"_"+S.roommateGender+"_"+S.playerGender}
function seen(e){return S.seenEvents.includes(eventKey(e))}
function markSeen(e){const k=eventKey(e);if(!S.seenEvents.includes(k))S.seenEvents.push(k)}
function bunnyHtml(text){return `<div class="mascot"><div class="bunny"><div class="ear l"></div><div class="ear r"></div><div class="body"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="tail"></div></div><div class="mascot-text"><b>绒团团</b><br>${esc(text)}</div></div>`}
function bunnyComment(context={}){
 let line;
 if(context.emotion==='sad') line=pick(["……它刚刚笑了，但我觉得那不是真的开心。","我不评价。我只是觉得你可以晚一点说。"]);
 else if(S.stats.grudge>68) line=pick(["你又说没事了。你们人类很喜欢这个词。","我有一个小问题：你真的没事吗？"][0]? ["你又说没事了。你们人类很喜欢这个词。","我有一个小问题：你真的没事吗？"]:["继续。"]);
 else if(context.fun) line=pick(["很好。事情开始变得不正常了。","我批准这件事。暂时。","我只是路过，但这个发展值得记录。"]);
 else if(context.kind) line=pick(["哦。你居然记得。","今天的人类有一点善良。","它会记住的。"]);
 else line=pick(["嗯。","继续。","我先不评价。","……有意思。","我记住了。"]);
 S.lastBunny=line;return line;
}
function start(){
 document.getElementById('returnBadge').textContent=S.playedBefore?'你回来过 ♡':'';
 document.getElementById('root').innerHTML=`<section class="screen"><div class="pad center"><div style="font-size:60px;margin:4px 0 9px">🐇</div><div class="pill">${S.playedBefore?'绒团团还记得你。':'A tiny week. A very real roommate.'}</div><h1 style="margin-top:13px">7 DAYS<br>WITH YOUR ROOMMATE</h1><p class="muted">你不会做题。<br>你只是住进来，然后看看这一周会发生什么。</p><div class="section stack"><button class="cta" onclick="setup()">开始这一周</button>${S.playedBefore?'<button class="cta secondary" onclick="showSecrets()">看看我已经发现的东西</button>':''}</div><div class="tiny" style="margin-top:15px">V0.4 · 事件池 + 自由时间 + 记忆试做版</div></div></section>`;
}
function setup(){document.getElementById('root').innerHTML=`<section class="screen"><div class="pad"><div class="tiny">MOVE IN</div><h2>先告诉他们怎么叫你。</h2><p class="muted">不一定是真名。你可以给这一周里的自己取一个称呼。</p><input id="pname" class="input" maxlength="16" placeholder="例如：小A / Alano / 随便什么" value="${esc(S.playerName)}"><div class="section"><h3>你</h3><div class="grid2"><button id="pg-female" class="choice-card" onclick="choosePG('female')"><div class="choice-title">女生</div><div class="choice-note">这会改变少数事件和互动方式。</div></button><button id="pg-male" class="choice-card" onclick="choosePG('male')"><div class="choice-title">男生</div><div class="choice-note">这会改变少数事件和互动方式。</div></button></div></div><div class="section"><h3>你要和谁一起住？</h3><div class="grid2"><button id="rg-female" class="choice-card" onclick="chooseRG('female')"><div class="choice-title">米拉</div><div class="choice-note">${ROOMMATES.female.flavor}</div></button><button id="rg-male" class="choice-card" onclick="chooseRG('male')"><div class="choice-title">米洛</div><div class="choice-note">${ROOMMATES.male.flavor}</div></button></div></div><div class="section"><button class="cta" onclick="begin()">搬进来</button></div></div></section>`;syncSetup()}
function choosePG(g){S.playerGender=g;syncSetup()}function chooseRG(g){S.roommateGender=g;S.roommateName=ROOMMATES[g].name;syncSetup()}function syncSetup(){for(const x of ['female','male']){document.getElementById('pg-'+x)?.classList.toggle('selected',x===S.playerGender);document.getElementById('rg-'+x)?.classList.toggle('selected',x===S.roommateGender)}}
function begin(){const n=(document.getElementById('pname')?.value||'').trim();if(!n||!S.playerGender||!S.roommateGender){toast('先把称呼、你和对方都选好。');return}const oldPlayed=S.playedBefore;S=JSON.parse(JSON.stringify(DEFAULT));S.playedBefore=oldPlayed;S.playerName=n;S.playerGender=document.getElementById('pg-female')?.classList.contains('selected')?'female':'male';S.roommateGender=document.getElementById('rg-female')?.classList.contains('selected')?'female':'male';S.roommateName=ROOMMATES[S.roommateGender].name;save();dayIntro(1)}
function dayIntro(day){S.day=day;S.timeBlock=0;save();document.getElementById('root').innerHTML=`<section class="screen"><div class="transition"><div class="tiny">DAY</div><div class="big">${day}</div><h2>${day===1?'入住。':day===7?'最后一天。':'又是一天。'}</h2><p class="muted">${day===1?`你、${rn()}和绒团团第一次住进这里。`:`你已经开始知道${rn()}是什么样的人了。`}</p>${bunnyHtml(day===1?(S.playedBefore?'“你又回来了。”':'“我叫绒团团。”'):(S.stats.grudge>65?'“今天的空气有一点记仇。”':'“今天也许会发生一点什么。”'))}<button class="cta section" onclick="enterDay()">继续</button></div></section>`}
function enterDay(){const next=(S.day===1&&S.steps===0)?selectEvent('opening'):((S.day===7&&S.steps>=12)?selectEvent('ending'):selectEvent('daily'));if(next){renderEvent(next)}else{freeTime()}}
function progress(){return Math.min(100,Math.round((S.steps/14)*100))}
function renderEvent(e){if(!e){finish();return}S.currentEvent=e.id;markSeen(e);save();const story=e.story(S);document.getElementById('root').innerHTML=`<section class="screen"><div class="day-card"><div class="day-row"><div><div class="day-label">DAY ${S.day}</div><div class="day-title">${esc(e.title)}</div></div><div class="tiny">第 ${S.steps+1} 个片段</div></div><div class="progress"><span style="width:${progress()}%"></span></div></div><div class="scene"><div class="time-row"><span class="pill">${esc(rn())}</span><span class="event-time">${esc(e.time)}</span></div><div class="event-title">${esc(e.title)}</div><div class="story">${story.map(x=>x.startsWith('《')&&x.endsWith('》')?`<div class="quote">${esc(x.slice(1,-1))}</div>`:`<p>${esc(x)}</p>`).join('')}</div>${e.say?`<div class="dialogue"><div class="who">${esc(rn())}</div>${esc(e.say(S)).replace(/\n/g,'<br>')}</div>`:''}<div class="tiny" style="margin-top:15px">你会：</div><div class="choices">${e.options(S).map((o,i)=>`<button class="option" onclick="chooseEvent(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(o.text)}</button>`).join('')}</div>${bunnyHtml(e.bunny?e.bunny(S):bunnyComment({}))}</div></section>`;window.__event=e}
function chooseEvent(i){const e=window.__event;const o=e.options(S)[i];apply(o.mod||{});if(o.flag)setFlag(o.flag,true);if(o.like)addLike(o.like);if(o.item)addItem(o.item);if(o.remember)remember(o.remember,o.icon||'✦');if(o.rel)apply(o.rel);if(o.secret){const t=o.secret.type==='roommate'?S.roommateGender:o.secret.type;addSecret(t,o.secret.id,o.secret.text)}S.history.push({id:e.id,option:o.text,day:S.day});S.steps++;if(o.delayFlag)setFlag(o.delayFlag,true);S.lastReaction=o.react||pick([`${rn()}看了你一眼。`,`${rn()}没有立刻说话。`,`${rn()}像是想说什么，最后又算了。`]);if(o.bunnyText)S.lastBunny=o.bunnyText;else bunnyComment({fun:o.fun,kind:o.kind,emotion:o.emotion});save();reactionScreen(e,o)}
function reactionScreen(e,o){document.getElementById('root').innerHTML=`<section class="screen"><div class="scene"><div class="reaction"><div class="reaction-title">${esc(rn())} 的反应</div><div>${esc(S.lastReaction)}</div></div>${bunnyHtml(S.lastBunny||bunnyComment({}))}<button class="cta section" onclick="afterEvent()">继续</button></div></section>`}
function afterEvent(){if(S.steps>=14){finish();return}const newDay=Math.min(7,1+Math.floor(S.steps/2));if(newDay!==S.day){dayIntro(newDay);return}if(S.steps%3===0){freeTime();return}const next=(S.day===7&&S.steps>=12)?selectEvent('ending'):selectEvent('daily');if(next)renderEvent(next);else freeTime()}
function freeTime(){if(S.day>=7&&S.steps>=14){finish();return}const options=[];const hour=['8:12 PM','9:05 PM','10:41 PM','11:26 PM'][S.timeBlock%4];S.timeBlock++;options.push({k:'room',title:'留在房间',desc:`看看${rn()}在干什么，也可以做自己的事。`});options.push({k:'talk',title:`找${rn()}聊聊`,desc:'不一定发生大事，也可能只是说几句废话。'});options.push({k:'bunny',title:'找绒团团',desc:'它今天可能藏在某个奇怪的地方。'});if(S.stats.social>45||S.steps>4)options.push({k:'out',title:'出去走走',desc:'便利店、街边、夜风，随便什么。'});if(S.steps>2)options.push({k:'shop',title:'去买点东西',desc:'买一点自己的东西，顺便看看会不会遇到什么。'});if(S.steps>3)options.push({k:'phone',title:'刷一会儿手机',desc:'朋友、群聊、短消息。你自己的生活也会继续。'});document.getElementById('root').innerHTML=`<section class="screen"><div class="day-card"><div class="day-row"><div><div class="day-label">DAY ${S.day}</div><div class="day-title">${hour}</div></div><span class="pill">FREE TIME</span></div><div class="progress"><span style="width:${progress()}%"></span></div></div><div class="scene"><h2>现在想做什么？</h2><p class="muted">今天没有规定你一定要做什么。</p><div class="activity-grid">${options.map(o=>`<button class="activity" onclick="doActivity('${o.k}')"><b>${esc(o.title)}</b><small>${esc(o.desc)}</small></button>`).join('')}</div>${bunnyHtml(S.steps===0?'“你终于可以自己决定了。”':'“你自己选。”')}</div></section>`}
function doActivity(k){S.lastActivity=k;save();if(k==='room')roomScene();else if(k==='talk')talkScene();else if(k==='bunny')bunnyScene();else if(k==='out')outScene();else if(k==='shop')shopScene();else phoneScene()}

function showSecrets(){const r=getSecretsForRole();document.getElementById('root').innerHTML=`<section class="screen"><div class="pad"><div class="tiny">THINGS YOU FOUND</div><h2>这一周留下来的东西。</h2><p class="muted">有些是秘密，有些只是你记住的小事。</p><div class="result-block"><h3>🔐 ${esc(rn())} 的秘密</h3>${r.length?r.map(x=>`<div class="secret"><b>${esc(x.text)}</b></div>`).join(''):'<div class="secret"><small>还没有解锁。再住几天。</small></div>'}</div><div class="result-block"><h3>🐇 绒团团</h3>${(S.secrets.bunny||[]).map(x=>`<div class="secret"><b>${esc(x.text)}</b></div>`).join('')||'<div class="secret"><small>它还没有承认任何事情。</small></div>'}</div><div class="result-block"><h3>🧠 你</h3>${(S.secrets.player||[]).map(x=>`<div class="secret"><b>${esc(x.text)}</b></div>`).join('')||'<div class="secret"><small>你还没有把自己暴露得太明显。</small></div>'}</div><div class="section grid2"><button class="cta secondary" onclick="start()">回到首页</button><button class="cta" onclick="setup()">再住一周</button></div></div></section>`}
function finish(){S.ending=true;S.playedBefore=true;const same=S.rel.closeness>70&&S.rel.trust>70;const soft=S.rel.closeness<38;const tense=S.stats.grudge>70||S.stats.conflict>68;let key,title,desc;if(S.history.some(h=>h.id==='lastnight'&&h.option.includes('算了'))||soft){key='separate';title='🧳 算了吧，也许就到这里';desc=`你们没有大吵。${rn()}甚至还是笑着的。可有些关系不是靠“没事”就能继续。`;}else if(same){key='synced';title='❤️ 你们已经有一点默契了';desc=`你们还是会吵，会互相嫌弃，会忘记扔垃圾。但${pName()}已经知道${rn()}说“等一下”时大概意味着什么。`;}else if(tense){key='messy';title='🔥 很乱，但至少是真的';desc=`这一周并不平静。你们踩过雷，也说过重话。但至少，没有人假装自己完全没感觉。`;}else if(S.rel.bunny>75){key='bunny';title='🐇 绒团团批准你入住';desc=`至于${rn()}？它可能还是不懂。绒团团倒是已经把你列入了自己人。`;}else{key='soft';title='🌙 一周结束了';desc=`你们没有突然变成最好的朋友。只是开始知道，对方的一些小习惯了。`;}S.ending=key;save();document.getElementById('root').innerHTML=`<section class="screen"><div class="pad"><div class="pill">WEEK COMPLETE</div><h2 style="margin-top:10px">${esc(title)}</h2><p class="muted">${esc(desc)}</p><div class="result-block"><h3>👀 ${esc(rn())}眼里的你</h3><p>${esc(roommateView())}</p></div><div class="result-block"><h3>🐇 绒团团观察报告</h3><p>${esc(selfView())}</p></div><div class="result-block"><h3>🔐 小秘密</h3><p>${esc(secretTease())}</p></div><div class="result-block"><h3>📦 这一周记住了</h3><div class="memory-list">${S.memories.slice(-8).map(m=>`<div class="memory"><div class="icon">${esc(m.icon)}</div><div>${esc(m.text)}</div></div>`).join('')}</div></div><div class="result-block"><h3>💌 这一周以后</h3><p>${esc(afterWeek())}</p></div><div class="section grid2"><button class="cta secondary" onclick="start()">回到首页</button><button class="cta" onclick="again()">再住一周</button></div></div></section>`}
function roommateView(){if(S.ending==='separate')return `${rn()}大概会说：“你其实没有那么难相处。只是我们有些东西不太合拍。”`;if(S.rel.closeness>72)return `${rn()}会叫你“${pName()}”。有时候，它已经不觉得这个称呼是随口的了。`;if(S.stats.grudge>68)return `${rn()}会提醒自己：${pName()}说“没事”的时候，最好多问一句。`;return `${rn()}觉得你还挺好相处。只是有些话，你喜欢自己消化。`}
function selfView(){if(S.stats.boundaries>68&&S.stats.social>60)return '你不是害怕冲突。你只是更希望事情说清楚。';if(S.stats.grudge>68)return '你看起来很平静，但你记得的事情比别人想象中多。';if(S.rel.bunny>70)return '你对奇怪的小生物非常没有抵抗力。';return '你这一周没有表现得完美，但你确实在试着找到一种属于自己的共同生活方式。'}
function secretTease(){const all=[...(S.secrets[S.roommateGender]||[]),...(S.secrets.bunny||[]),...(S.secrets.player||[])];if(!all.length)return '0 个隐藏秘密。绒团团对此表示遗憾。';return `已经发现 ${all.length} 个秘密。还有一些东西，它们还没准备好告诉你。`}
function afterWeek(){if(S.ending==='separate')return `${rn()}没有再问第二次。第二天，你发现冰箱里还留着你喜欢的东西。它没有解释。`;if(S.ending==='synced')return `第二天早上，${rn()}又说：“等一下。”你看了它一眼。\n“这次说具体一点。”\n它笑了。`;if(S.rel.bunny>75)return `绒团团趴在你的包上。它决定你暂时可以继续住。`;return `一周不够认识一个人。\n但已经够让一些很小的事情留下来了。`}
function again(){const pg=S.playerGender,rg=S.roommateGender,n=S.playerName;const played=true;S=JSON.parse(JSON.stringify(DEFAULT));S.playedBefore=played;S.playerGender=pg;S.roommateGender=rg;S.playerName=n;S.roommateName=ROOMMATES[rg].name;save();dayIntro(1)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
start();
</script>
